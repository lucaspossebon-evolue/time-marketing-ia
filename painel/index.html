<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0C0E">
<title>Painel · Lúmen Marketing Digital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 124 124'%3E%3Crect x='2' y='2' width='120' height='120' rx='32' fill='%2316181C'/%3E%3Ccircle cx='62' cy='62' r='13' fill='%23C8FF4D'/%3E%3Cpath d='M62 24V36M62 88V100M24 62H36M88 62H100M35 35L43 43M81 81L89 89M89 35L81 43M43 81L35 89' stroke='%23C8FF4D' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0B0C0E;--bg2:#111316;--card:#16181C;--card2:#1c1f24;--line:#2A2E35;--tx:#F2F4F0;--tx2:#A3A8A0;--ac:#C8FF4D;--ac2:#3D7BFF;--ok:#22c55e;--wa:#eab308;--er:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"JetBrains Mono",monospace}
a{color:var(--ac)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 500px at 85% -10%,rgba(200,255,77,.12),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(61,123,255,.12),transparent 60%)}
.login form{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.marca{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.marca svg{width:44px;height:44px;flex:none}
.marca b{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1}.marca b i{font-style:normal;color:var(--ac)}
.marca small{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:2.5px;color:var(--tx2);margin-top:4px}
.login h1{font-size:19px;margin-bottom:4px}.login p{color:var(--tx2);font-size:13px;margin-bottom:18px}
.campo{display:block;margin-bottom:12px}.campo span{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
.campo input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.campo input:focus{border-color:var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0B0C0E;font-weight:800}
.btn.er{color:#fca5a5;border-color:rgba(239,68,68,.4)}
.btn.full{width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:default}
.erro{color:#fca5a5;font-size:12.5px;min-height:18px;margin-top:10px}
/* topo */
.topo{position:sticky;top:0;z-index:5;background:rgba(11,12,14,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topo .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.topo .marca{margin:0}.topo .marca svg{width:34px;height:34px}.topo .marca b{font-size:18px}
.topo select{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;max-width:220px}
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2);margin-left:auto}
.vivo i{width:8px;height:8px;border-radius:50%;background:#64748b}.vivo.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.sair{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--tx2)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cab h2{font-size:22px;font-weight:800;letter-spacing:-.4px}.cab p{color:var(--tx2);font-size:13px;margin-top:2px}
.abas{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;scrollbar-width:none}
.aba{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--tx2);white-space:nowrap}
.aba.on{background:var(--ac);border-color:var(--ac);color:#0B0C0E;font-weight:700}
.aba em{font-style:normal;margin-left:6px;background:rgba(0,0,0,.18);border-radius:999px;padding:1px 7px;font-size:11.5px}
.aba:not(.on) em{background:var(--card2);color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.1}.kpi span{font-size:12px;color:var(--tx2)}
.kpi.alerta{border-color:rgba(239,68,68,.55)}.kpi.alerta b{color:#fca5a5}
.vazio{color:var(--tx2);text-align:center;padding:46px 10px;border:1px dashed var(--line);border-radius:16px}
/* posts */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media(max-width:400px){.grade{grid-template-columns:1fr}}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.post.st-erro{border-color:rgba(239,68,68,.6)}
.midia{position:relative;background:#000;aspect-ratio:4/5}
.midia.vert{aspect-ratio:9/16;max-height:560px}
.trilho{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.trilho::-webkit-scrollbar{display:none}
.trilho img,.trilho video{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:start;background:#000}
.cont{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);border-radius:999px;padding:3px 9px;font-size:11.5px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:18px;display:grid;place-items:center}
.nav.e{left:8px}.nav.d{right:8px}
.corpo{padding:14px 15px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.s-aguardando{background:rgba(234,179,8,.16);border-color:rgba(234,179,8,.4);color:#fde047}
.s-aprovado{background:rgba(61,123,255,.18);border-color:rgba(61,123,255,.45);color:#a9c4ff}
.s-ajustar{background:rgba(249,115,22,.16);border-color:rgba(249,115,22,.45);color:#fdba74}
.s-publicado{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.45);color:#86efac}
.s-reprovado{background:rgba(100,116,139,.2);color:#94a3b8}
.s-erro{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.5);color:#fca5a5}
.post h3{font-size:16px;font-weight:700;line-height:1.3}
.legenda{color:var(--tx2);font-size:13px;line-height:1.5;white-space:pre-line;max-height:7.5em;overflow:hidden;position:relative}
.legenda.aberta{max-height:none}
.mais{background:none;border:none;color:var(--ac);font-size:12.5px;padding:0;align-self:flex-start}
.hash{color:var(--ac2);font-size:12.5px}
.obs{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--tx2)}
.obs b{color:var(--tx)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.acoes .btn{flex:1}
.ajuste{display:none;flex-direction:column;gap:8px}
.ajuste.on{display:flex}
.ajuste textarea{width:100%;min-height:80px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical;outline:none}
.ajuste textarea:focus{border-color:var(--ac)}
/* agenda */
.dia{margin-bottom:14px}
.dia h4{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx2);margin-bottom:8px;font-family:"JetBrains Mono",monospace;font-weight:500}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:8px}
.item img{width:46px;height:58px;object-fit:cover;border-radius:8px;flex:none;background:#000}
.item .ph{width:46px;height:58px;border-radius:8px;flex:none;background:var(--card2);display:grid;place-items:center;color:var(--tx2);font-size:18px}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-size:14px;font-weight:600}.item .tx span{font-size:12px;color:var(--tx2)}
/* arquivos */
.arqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.arq{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--tx)}
.arq .th{aspect-ratio:4/5;background:#000 center/cover no-repeat;position:relative}
.arq .th i{position:absolute;inset:auto 6px 6px auto;background:rgba(0,0,0,.65);border-radius:999px;padding:2px 8px;font-size:11px;font-style:normal}
.arq div.l{padding:8px 10px;font-size:11.5px;color:var(--tx2)}
/* equipe */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros input{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.clis{display:flex;flex-direction:column;gap:10px}
.cli{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;text-align:left;width:100%}
.cli:hover{border-color:var(--ac)}
.cli.prob{border-color:rgba(239,68,68,.55)}
.cli .n{font-size:16px;font-weight:700}.cli .n small{font-weight:500;color:var(--tx2);font-size:12.5px;margin-left:6px}
.sinais{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sin{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--tx2)}
.sin.ok{color:#86efac;border-color:rgba(34,197,94,.4)}.sin.no{color:#fca5a5;border-color:rgba(239,68,68,.45)}.sin.at{color:#fde047;border-color:rgba(234,179,8,.45)}
.probs{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.probs div{font-size:12.5px;color:#fca5a5}
.cli .lado{text-align:right;font-size:12px;color:var(--tx2);display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ac);color:#0B0C0E;font-weight:700;border-radius:999px;padding:10px 18px;opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.ruim{background:#ef4444;color:#fff}
.voltar{background:none;border:none;color:var(--tx2);font-size:13px;margin-bottom:8px;padding:0}
</style>
</head>
<body>

<section class="login" id="telaLogin" hidden>
  <form id="formLogin" autocomplete="on">
    <div class="marca"><svg viewBox="0 0 124 124"><rect x="2" y="2" width="120" height="120" rx="32" fill="#16181C" stroke="#2A2E35" stroke-width="3"/><circle cx="62" cy="62" r="13" fill="#C8FF4D"/><path d="M62 24V36M62 88V100M24 62H36M88 62H100M35 35L43 43M81 81L89 89M89 35L81 43M43 81L35 89" stroke="#C8FF4D" stroke-width="7" stroke-linecap="round"/></svg><div><b>lúmen<i>.</i></b><small>MARKETING DIGITAL</small></div></div>
    <h1>Painel do cliente</h1>
    <p>Aprove seus posts, acompanhe a agenda e baixe os arquivos.</p>
    <label class="campo"><span>E-mail</span><input id="email" type="email" required autocomplete="username"></label>
    <label class="campo"><span>Senha</span><input id="senha" type="password" required autocomplete="current-password"></label>
    <button class="btn pri full" id="btnEntrar">Entrar</button>
    <div class="erro" id="erroLogin"></div>
  </form>
</section>

<section id="telaPainel" hidden>
  <header class="topo"><div class="in">
    <div class="marca"><svg viewBox="0 0 124 124"><rect x="2" y="2" width="120" height="120" rx="32" fill="#16181C" stroke="#2A2E35" stroke-width="3"/><circle cx="62" cy="62" r="13" fill="#C8FF4D"/><path d="M62 24V36M62 88V100M24 62H36M88 62H100M35 35L43 43M81 81L89 89M89 35L81 43M43 81L35 89" stroke="#C8FF4D" stroke-width="7" stroke-linecap="round"/></svg><div><b>lúmen<i>.</i></b><small id="papel">PAINEL</small></div></div>
    <select id="selCliente" hidden aria-label="Cliente"></select>
    <span class="vivo" id="vivo"><i></i><span id="vivoTxt">conectando…</span></span>
    <button class="sair" id="trocarSenha" title="Trocar senha">🔑</button><button class="sair" id="sair">Sair</button>
  </div></header>
  <main id="conteudo"></main>
</section>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://wmfevnhfkgrwvernyqcf.supabase.co";
const SUPABASE_KEY = "sb_publishable_UHvzB_OuCtbda_rGxunDXw_WGBIE6wH";
const TIPO = { carrossel: "Carrossel", post_unico: "Post", reels: "Reels", story: "Story" };
const STATUS = { aguardando: "Aguardando aprovação", aprovado: "Aprovado · agendado", ajustar: "Em ajuste", publicado: "Publicado", reprovado: "Reprovado", erro: "Erro na publicação" };
const PAUTA = { planejada: "Planejada", em_producao: "Em produção", produzida: "Produzida", descartada: "Descartada" };
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const H = 3600e3;
let sb, eu = null, clientes = [], posts = [], pautas = [], atual = null, aba = "aprovar", modo = "cliente", filtroProb = false, recarregar = null;

function dataBR(iso, comHora = true) {
  if (!iso) return "—";
  const d = new Date(iso.length === 10 ? iso + "T12:00:00-03:00" : iso);
  const o = { weekday: "short", day: "2-digit", month: "2-digit", timeZone: "America/Sao_Paulo" };
  if (comHora) Object.assign(o, { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleString("pt-BR", o).replace(".", "");
}
function ha(iso) {
  if (!iso) return "nunca";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "agora"; if (m < 60) return `há ${m} min`;
  const h = Math.round(m / 60); if (h < 48) return `há ${h} h`;
  return `há ${Math.round(h / 24)} dias`;
}
function toast(t, ruim) { const e = $("#toast"); e.textContent = t; e.className = "toast on" + (ruim ? " ruim" : ""); clearTimeout(e._t); e._t = setTimeout(() => (e.className = "toast"), 2600); }
function mostrar(t) { $("#telaLogin").hidden = t !== "login"; $("#telaPainel").hidden = t !== "painel"; }
function vivo(on, txt) { $("#vivo").classList.toggle("on", on); $("#vivoTxt").textContent = txt; }

// ---------- sessão ----------
async function iniciar() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await sb.auth.getSession();
  if (data.session) entrar(); else mostrar("login");
}
$("#formLogin").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#erroLogin").textContent = ""; $("#btnEntrar").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#senha").value });
  $("#btnEntrar").disabled = false;
  if (error) { $("#erroLogin").textContent = "Não consegui entrar. Confira o e-mail e a senha."; return; }
  entrar();
});
$("#sair").onclick = async () => { await sb.auth.signOut(); location.reload(); };
$("#trocarSenha").onclick = async () => {
  const n = prompt("Digite a nova senha (mínimo 8 caracteres):");
  if (!n) return; if (n.length < 8) return toast("A senha precisa ter pelo menos 8 caracteres", true);
  const { error } = await sb.auth.updateUser({ password: n });
  error ? toast("Não consegui trocar a senha: " + error.message, true) : toast("Senha alterada!");
};

async function entrar() {
  mostrar("painel");
  const { data, error } = await sb.rpc("lumen_eu");
  if (error) { $("#conteudo").innerHTML = `<div class="vazio">Erro ao abrir o painel: ${esc(error.message)}</div>`; return; }
  eu = data;
  if (!eu.equipe && !eu.clientes.length) {
    $("#conteudo").innerHTML = '<div class="vazio">Seu acesso ainda não foi liberado. Fale com a equipe da Lúmen.</div>'; vivo(false, ""); return;
  }
  $("#papel").textContent = eu.equipe ? "PAINEL DA EQUIPE" : "PAINEL DO CLIENTE";
  await carregar();
  const prm = new URLSearchParams(location.search).get("cliente");
  if (eu.equipe && !prm) { modo = "equipe"; } else { modo = "cliente"; atual = clientes.find((c) => c.slug === prm) || clientes[0]; }
  montarSeletor(); render();
  sb.channel("lumen-painel")
    .on("postgres_changes", { event: "*", schema: "public", table: "lumen_posts" }, agendarRecarga)
    .on("postgres_changes", { event: "*", schema: "public", table: "lumen_clientes" }, agendarRecarga)
    .subscribe((s) => vivo(s === "SUBSCRIBED", s === "SUBSCRIBED" ? "ao vivo" : "reconectando…"));
  setInterval(agendarRecarga, 5 * 60e3);
}
function agendarRecarga() { clearTimeout(recarregar); recarregar = setTimeout(async () => { await carregar(); render(true); }, 700); }

async function carregar() {
  const desde = new Date(Date.now() - 120 * 864e5).toISOString();
  const [c, p, a] = await Promise.all([
    sb.from("lumen_clientes").select("id,slug,nome,instagram,pacote,status,telegram_chat_id,ig_user_id,horario_publicacao,ultimo_ciclo,ultimo_erro,ultimo_erro_em").order("nome"),
    sb.from("lumen_posts").select("*").gte("criado_em", desde).order("data_publicacao", { ascending: true }),
    sb.from("lumen_pautas").select("*").gte("data_prevista", new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10)).order("data_prevista"),
  ]);
  if (c.error || p.error || a.error) { toast("Erro ao carregar dados", true); return; }
  clientes = c.data; posts = p.data; pautas = a.data;
  if (atual) atual = clientes.find((x) => x.id === atual.id) || atual;
}

function montarSeletor() {
  const s = $("#selCliente");
  if (clientes.length < 2 && !eu.equipe) { s.hidden = true; return; }
  s.hidden = false;
  s.innerHTML = (eu.equipe ? '<option value="">Todos os clientes</option>' : "") + clientes.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join("");
  s.value = modo === "equipe" ? "" : String(atual?.id || "");
  s.onchange = () => { if (!s.value) { modo = "equipe"; atual = null; } else { modo = "cliente"; atual = clientes.find((c) => String(c.id) === s.value); aba = "aprovar"; } history.replaceState(null, "", modo === "equipe" ? location.pathname : "?cliente=" + atual.slug); render(); };
}

// ---------- saúde (equipe) ----------
function problemas(c) {
  const ps = posts.filter((p) => p.cliente_id === c.id), out = [];
  const ativo = ["ativo", "implantacao"].includes(c.status);
  const erros = ps.filter((p) => p.status === "erro");
  if (erros.length) out.push(`${erros.length} post(s) com erro na publicação`);
  const atrasados = ps.filter((p) => p.status === "aprovado" && new Date(p.data_publicacao) < Date.now() - 1.5 * H);
  if (atrasados.length) out.push(`${atrasados.length} post(s) aprovado(s) e atrasado(s)`);
  if (c.ultimo_erro && c.ultimo_erro_em && Date.now() - new Date(c.ultimo_erro_em) < 24 * H) out.push(`Último erro (${ha(c.ultimo_erro_em)}): ${c.ultimo_erro}`);
  if (ativo && !c.telegram_chat_id) out.push("Telegram de aprovação não vinculado");
  if (ativo && !c.ig_user_id) out.push("Instagram não conectado (não publica sozinho)");
  if (ativo && c.telegram_chat_id && (!c.ultimo_ciclo || Date.now() - new Date(c.ultimo_ciclo) > 2.5 * H)) out.push(`Robô sem rodar ${c.ultimo_ciclo ? ha(c.ultimo_ciclo) : "ainda"}`);
  return out;
}

// ---------- render ----------
function render(silencioso) {
  if (modo === "equipe") return renderEquipe();
  renderCliente(silencioso);
}

function renderEquipe() {
  const ativos = clientes.filter((c) => ["ativo", "implantacao"].includes(c.status));
  const comProb = clientes.filter((c) => problemas(c).length);
  const aguard = posts.filter((p) => p.status === "aguardando").length;
  const semana = posts.filter((p) => p.status === "publicado" && Date.now() - new Date(p.publicado_em) < 7 * 864e5).length;
  const q = ($("#buscaCli")?.value || "").toLowerCase();
  let lista = clientes.filter((c) => !q || (c.nome + " " + c.instagram + " " + c.slug).toLowerCase().includes(q));
  if (filtroProb) lista = lista.filter((c) => problemas(c).length);
  lista.sort((a, b) => problemas(b).length - problemas(a).length);
  const foco = document.activeElement?.id === "buscaCli";
  $("#conteudo").innerHTML = `
    <div class="cab"><div><h2>Visão da equipe</h2><p>Todos os clientes da Lúmen, com alertas de erro em destaque.</p></div></div>
    <div class="kpis">
      <div class="kpi"><b>${ativos.length}</b><span>clientes ativos</span></div>
      <div class="kpi ${comProb.length ? "alerta" : ""}"><b>${comProb.length}</b><span>com problema</span></div>
      <div class="kpi"><b>${aguard}</b><span>posts aguardando aprovação</span></div>
      <div class="kpi"><b>${semana}</b><span>publicados nos últimos 7 dias</span></div>
    </div>
    <div class="filtros"><input id="buscaCli" placeholder="Buscar cliente…" value="${esc(q)}">
      <button class="aba ${filtroProb ? "on" : ""}" id="soProb">Só com problema <em>${comProb.length}</em></button></div>
    <div class="clis">${lista.map(cardCliente).join("") || '<div class="vazio">Nenhum cliente encontrado.</div>'}</div>`;
  $("#buscaCli").oninput = () => renderEquipe();
  if (foco) { const i = $("#buscaCli"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  $("#soProb").onclick = () => { filtroProb = !filtroProb; renderEquipe(); };
  document.querySelectorAll(".cli").forEach((b) => (b.onclick = () => { atual = clientes.find((c) => String(c.id) === b.dataset.id); modo = "cliente"; aba = "aprovar"; $("#selCliente").value = String(atual.id); history.replaceState(null, "", "?cliente=" + atual.slug); render(); }));
}
function cardCliente(c) {
  const pr = problemas(c), ps = posts.filter((p) => p.cliente_id === c.id);
  const n = (s) => ps.filter((p) => p.status === s).length;
  const prox = ps.filter((p) => ["aprovado", "aguardando"].includes(p.status)).sort((a, b) => new Date(a.data_publicacao) - new Date(b.data_publicacao))[0];
  return `<button class="cli ${pr.length ? "prob" : ""}" data-id="${c.id}">
    <div><div class="n">${esc(c.nome)}<small>${esc(c.instagram || "")}</small></div>
      <div class="sinais">
        <span class="sin">${esc(c.pacote || "—")}</span>
        <span class="sin ${c.status === "ativo" ? "ok" : "at"}">${esc(c.status)}</span>
        <span class="sin ${c.telegram_chat_id ? "ok" : "no"}">Telegram ${c.telegram_chat_id ? "✓" : "✗"}</span>
        <span class="sin ${c.ig_user_id ? "ok" : "no"}">Instagram ${c.ig_user_id ? "✓" : "✗"}</span>
        ${n("aguardando") ? `<span class="sin at">${n("aguardando")} aguardando</span>` : ""}
        ${n("ajustar") ? `<span class="sin at">${n("ajustar")} em ajuste</span>` : ""}
      </div></div>
    <div class="lado"><span>Robô: ${ha(c.ultimo_ciclo)}</span><span>Próximo: ${prox ? dataBR(prox.data_publicacao) : "—"}</span><span>${n("publicado")} publicados</span></div>
    ${pr.length ? `<div class="probs">${pr.map((x) => `<div>⚠ ${esc(x)}</div>`).join("")}</div>` : ""}
  </button>`;
}

function renderCliente(silencioso) {
  if (!atual) { $("#conteudo").innerHTML = '<div class="vazio">Nenhum cliente selecionado.</div>'; return; }
  const ps = posts.filter((p) => p.cliente_id === atual.id);
  const pend = ps.filter((p) => p.status === "aguardando" || (eu.equipe && p.status === "erro"));
  const emAndamento = ps.filter((p) => ["ajustar", "aprovado"].includes(p.status));
  const pub = ps.filter((p) => p.status === "publicado").sort((a, b) => new Date(b.publicado_em) - new Date(a.publicado_em));
  // preserva ajustes digitados
  const rascunhos = {}; document.querySelectorAll(".ajuste textarea").forEach((t) => { if (t.value) rascunhos[t.dataset.id] = t.value; });
  const abertos = [...document.querySelectorAll(".ajuste.on")].map((d) => d.dataset.id);
  const pr = eu.equipe ? problemas(atual) : [];
  let corpo = "";
  if (aba === "aprovar") corpo = pend.length || emAndamento.length
    ? `${pend.length ? `<div class="grade">${pend.map(cardPost).join("")}</div>` : '<div class="vazio">Nada aguardando sua aprovação agora. 🎉</div>'}
       ${emAndamento.length ? `<h3 style="margin:22px 0 10px;font-size:15px">Em andamento</h3><div class="grade">${emAndamento.map(cardPost).join("")}</div>` : ""}`
    : '<div class="vazio">Nada aguardando sua aprovação agora. Os próximos posts chegam aqui e no Telegram um dia antes de irem ao ar.</div>';
  else if (aba === "agenda") corpo = renderAgenda(ps);
  else if (aba === "publicados") corpo = pub.length ? `<div class="grade">${pub.map(cardPost).join("")}</div>` : '<div class="vazio">Ainda não há posts publicados.</div>';
  else if (aba === "arquivos") corpo = renderArquivos(ps);
  $("#conteudo").innerHTML = `
    ${eu.equipe ? '<button class="voltar" id="voltar">← Todos os clientes</button>' : ""}
    <div class="cab"><div><h2>${esc(atual.nome)}</h2><p>${esc(atual.instagram || "")} · Pacote ${esc(atual.pacote || "—")} · publicações às ${esc(atual.horario_publicacao || "18:30")}</p></div></div>
    ${pr.length ? `<div class="obs" style="border-color:rgba(239,68,68,.5);margin-bottom:14px">${pr.map((x) => `<div style="color:#fca5a5">⚠ ${esc(x)}</div>`).join("")}</div>` : ""}
    <nav class="abas">
      ${[["aprovar", "Para aprovar", pend.length], ["agenda", "Agenda"], ["publicados", "Publicados", pub.length], ["arquivos", "Arquivos"]]
        .map(([k, t, n]) => `<button class="aba ${aba === k ? "on" : ""}" data-aba="${k}">${t}${n ? `<em>${n}</em>` : ""}</button>`).join("")}
    </nav>${corpo}`;
  document.querySelectorAll("[data-aba]").forEach((b) => (b.onclick = () => { aba = b.dataset.aba; render(); }));
  if ($("#voltar")) $("#voltar").onclick = () => { modo = "equipe"; atual = null; $("#selCliente").value = ""; history.replaceState(null, "", location.pathname); render(); };
  ligarPosts();
  Object.entries(rascunhos).forEach(([id, v]) => { const t = $(`.ajuste textarea[data-id="${id}"]`); if (t) t.value = v; });
  abertos.forEach((id) => $(`.ajuste[data-id="${id}"]`)?.classList.add("on"));
}

function cardPost(p) {
  const urls = p.tipo === "reels" && p.video_url ? [{ v: p.video_url, capa: p.capa_url }] : (p.midias || []).map((u) => ({ i: u }));
  const vert = p.tipo === "reels" || p.tipo === "story";
  const tags = (p.hashtags || []).map((h) => "#" + String(h).replace(/^#/, "")).join(" ");
  const pode = p.status === "aguardando";
  const midia = urls.length ? `<div class="midia ${vert ? "vert" : ""}"><div class="trilho" data-id="${p.id}">${urls.map((u) => u.v
      ? `<video src="${esc(u.v)}" poster="${esc(u.capa || "")}" controls playsinline preload="none"></video>`
      : `<img src="${esc(u.i)}" alt="" loading="lazy">`).join("")}</div>
      ${urls.length > 1 ? `<span class="cont" data-cont="${p.id}">1/${urls.length}</span><button class="nav e" data-nav="-1" data-id="${p.id}" aria-label="Anterior">‹</button><button class="nav d" data-nav="1" data-id="${p.id}" aria-label="Próxima">›</button>` : ""}</div>` : "";
  return `<article class="post st-${p.status}">${midia}
    <div class="corpo">
      <div class="meta"><span class="tag s-${p.status}">${STATUS[p.status] || p.status}</span><span class="tag">${TIPO[p.tipo] || p.tipo}</span><span class="mono">#${p.numero}</span>
        <span style="margin-left:auto">${p.status === "publicado" ? "Publicado " + dataBR(p.publicado_em) : "🗓 " + dataBR(p.data_publicacao)}</span></div>
      <h3>${esc(p.tema || "")}</h3>
      ${p.legenda ? `<div class="legenda" data-leg="${p.id}">${esc(p.legenda)}${tags ? `\n\n<span class="hash">${esc(tags)}</span>` : ""}</div><button class="mais" data-mais="${p.id}">ver legenda completa</button>` : ""}
      ${p.status === "ajustar" && p.obs ? `<div class="obs"><b>Ajuste pedido:</b> ${esc(p.obs)}<br>O time está refazendo e a nova versão aparece aqui.</div>` : ""}
      ${p.status === "erro" ? `<div class="obs" style="border-color:rgba(239,68,68,.5)"><b>Erro:</b> ${esc(p.obs || "falha ao publicar")}</div>` : ""}
      ${p.status === "aprovado" ? `<div class="obs">Vai ao ar sozinho em <b>${dataBR(p.data_publicacao)}</b>.</div>` : ""}
      ${p.status === "publicado" && p.ig_permalink ? `<a class="btn" href="${esc(p.ig_permalink)}" target="_blank" rel="noopener">Ver no Instagram ↗</a>` : ""}
      ${pode ? `<div class="ajuste" data-id="${p.id}"><textarea data-id="${p.id}" placeholder="O que você quer mudar? Ex.: troque o título da capa por…"></textarea>
          <div class="acoes"><button class="btn" data-cancelar="${p.id}">Cancelar</button><button class="btn pri" data-enviar="${p.id}">Enviar ajuste</button></div></div>
        <div class="acoes" data-botoes="${p.id}"><button class="btn pri" data-acao="aprovar" data-id="${p.id}">✓ Aprovar</button><button class="btn" data-acao="ajustar" data-id="${p.id}">✎ Ajustar</button><button class="btn er" data-acao="reprovar" data-id="${p.id}">✕ Reprovar</button></div>` : ""}
      ${p.status === "erro" && eu.equipe ? `<div class="acoes"><button class="btn pri" data-acao="tentar_novamente" data-id="${p.id}">↻ Tentar publicar de novo</button></div>` : ""}
    </div></article>`;
}

function ligarPosts() {
  document.querySelectorAll("[data-mais]").forEach((b) => {
    const l = $(`[data-leg="${b.dataset.mais}"]`);
    if (l.scrollHeight <= l.clientHeight + 4) b.remove();
    b.onclick = () => { l.classList.toggle("aberta"); b.textContent = l.classList.contains("aberta") ? "mostrar menos" : "ver legenda completa"; };
  });
  document.querySelectorAll(".trilho").forEach((t) => {
    const c = $(`[data-cont="${t.dataset.id}"]`);
    if (c) t.onscroll = () => { c.textContent = `${Math.round(t.scrollLeft / t.clientWidth) + 1}/${t.children.length}`; };
  });
  document.querySelectorAll("[data-nav]").forEach((b) => (b.onclick = () => { const t = $(`.trilho[data-id="${b.dataset.id}"]`); t.scrollBy({ left: t.clientWidth * Number(b.dataset.nav), behavior: "smooth" }); }));
  document.querySelectorAll("[data-acao]").forEach((b) => (b.onclick = async () => {
    const id = Number(b.dataset.id), acao = b.dataset.acao;
    if (acao === "ajustar") { $(`.ajuste[data-id="${id}"]`).classList.add("on"); $(`[data-botoes="${id}"]`).hidden = true; $(`.ajuste textarea[data-id="${id}"]`).focus(); return; }
    if (acao === "reprovar" && !confirm("Reprovar este post? Ele não será publicado.")) return;
    await decidir(id, acao, null, b);
  }));
  document.querySelectorAll("[data-cancelar]").forEach((b) => (b.onclick = () => { const id = b.dataset.cancelar; $(`.ajuste[data-id="${id}"]`).classList.remove("on"); $(`[data-botoes="${id}"]`).hidden = false; }));
  document.querySelectorAll("[data-enviar]").forEach((b) => (b.onclick = async () => {
    const id = Number(b.dataset.enviar), t = $(`.ajuste textarea[data-id="${id}"]`);
    if (!t.value.trim()) { t.focus(); return toast("Descreva o ajuste", true); }
    await decidir(id, "ajustar", t.value.trim(), b); t.value = "";
  }));
}
async function decidir(id, acao, obs, botao) {
  botao.disabled = true;
  const { error } = await sb.rpc("lumen_decidir", { p_post: id, p_acao: acao, p_obs: obs });
  botao.disabled = false;
  if (error) return toast(error.message, true);
  toast({ aprovar: "Aprovado! Vai ao ar no horário marcado.", ajustar: "Ajuste enviado ao time.", reprovar: "Post reprovado.", tentar_novamente: "Vai tentar publicar no próximo ciclo." }[acao]);
  await carregar(); render();
}

function renderAgenda(ps) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const itens = [];
  ps.filter((p) => !["reprovado"].includes(p.status) && new Date(p.data_publicacao) >= hoje - 864e5)
    .forEach((p) => itens.push({ d: new Date(p.data_publicacao), html: `<div class="item">${p.midias?.[0] ? `<img src="${esc(p.capa_url || p.midias[0])}" alt="" loading="lazy">` : '<div class="ph">▶</div>'}<div class="tx"><b>${esc(p.tema || "")}</b><span>${TIPO[p.tipo]} · ${new Date(p.data_publicacao).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" })}</span></div><span class="tag s-${p.status}">${STATUS[p.status]}</span></div>` }));
  pautas.filter((a) => a.cliente_id === atual.id && ["planejada", "em_producao"].includes(a.status))
    .forEach((a) => itens.push({ d: new Date(a.data_prevista + "T12:00:00-03:00"), html: `<div class="item"><div class="ph">✎</div><div class="tx"><b>${esc(a.tema)}</b><span>${TIPO[a.tipo] || a.tipo}${a.pilar ? " · " + esc(a.pilar) : ""}</span></div><span class="tag">${PAUTA[a.status]}</span></div>` }));
  if (!itens.length) return '<div class="vazio">A agenda da próxima semana é montada no domingo à noite.</div>';
  itens.sort((a, b) => a.d - b.d);
  const grupos = {};
  itens.forEach((i) => { const k = i.d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit", timeZone: "America/Sao_Paulo" }); (grupos[k] = grupos[k] || []).push(i.html); });
  return Object.entries(grupos).map(([k, v]) => `<div class="dia"><h4>${esc(k)}</h4>${v.join("")}</div>`).join("");
}

function renderArquivos(ps) {
  const arq = [];
  ps.filter((p) => !["reprovado"].includes(p.status)).slice().reverse().forEach((p) => {
    if (p.video_url) arq.push({ u: p.video_url, th: p.capa_url, n: `#${p.numero} · vídeo`, v: 1 });
    (p.midias || []).forEach((u, i) => { if (u !== p.capa_url || !p.video_url) arq.push({ u, th: u, n: `#${p.numero} · ${i + 1}/${p.midias.length}` }); });
  });
  if (!arq.length) return '<div class="vazio">Os arquivos dos posts aparecem aqui.</div>';
  return `<p style="color:var(--tx2);font-size:12.5px;margin-bottom:10px">Toque para baixar o arquivo em alta qualidade.</p><div class="arqs">${arq.map((a) => `<a class="arq" href="${esc(a.u)}?download=" target="_blank" rel="noopener"><div class="th" style="background-image:url('${esc(a.th || "")}')">${a.v ? "<i>▶ vídeo</i>" : ""}</div><div class="l">${esc(a.n)} ⬇</div></a>`).join("")}</div>`;
}

iniciar();
</script>
</body>
</html>
