<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0C0E">
<title>Painel · Lúmen Marketing Digital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 124 124'%3E%3Crect x='2' y='2' width='120' height='120' rx='32' fill='%2316181C'/%3E%3Ccircle cx='62' cy='62' r='13' fill='%23C8FF4D'/%3E%3Cpath d='M62 24V36M62 88V100M24 62H36M88 62H100M35 35L43 43M81 81L89 89M89 35L81 43M43 81L35 89' stroke='%23C8FF4D' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0B0C0E;--bg2:#111316;--card:#16181C;--card2:#1c1f24;--line:#2A2E35;--tx:#F2F4F0;--tx2:#A3A8A0;--ac:#C8FF4D;--ac2:#3D7BFF;--ok:#22c55e;--wa:#eab308;--er:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"JetBrains Mono",monospace}
a{color:var(--ac)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 500px at 85% -10%,rgba(200,255,77,.12),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(61,123,255,.12),transparent 60%)}
.login form{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.marca{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.marca svg{width:44px;height:44px;flex:none}
.marca b{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1}.marca b i{font-style:normal;color:var(--ac)}
.marca small{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:2.5px;color:var(--tx2);margin-top:4px}
.login h1{font-size:19px;margin-bottom:4px}.login p{color:var(--tx2);font-size:13px;margin-bottom:18px}
.campo{display:block;margin-bottom:12px}.campo span{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
.campo input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.campo input:focus{border-color:var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0B0C0E;font-weight:800}
.btn.er{color:#fca5a5;border-color:rgba(239,68,68,.4)}
.btn.full{width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:default}
.erro{color:#fca5a5;font-size:12.5px;min-height:18px;margin-top:10px}
/* topo */
.topo{position:sticky;top:0;z-index:5;background:rgba(11,12,14,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topo .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.topo .marca{margin:0}.topo .marca svg{width:34px;height:34px}.topo .marca b{font-size:18px}
.topo select{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;max-width:220px}
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2);margin-left:auto}
.vivo i{width:8px;height:8px;border-radius:50%;background:#64748b}.vivo.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.sair{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--tx2)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cab h2{font-size:22px;font-weight:800;letter-spacing:-.4px}.cab p{color:var(--tx2);font-size:13px;margin-top:2px}
.abas{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;scrollbar-width:none}
.aba{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--tx2);white-space:nowrap}
.aba.on{background:var(--ac);border-color:var(--ac);color:#0B0C0E;font-weight:700}
.aba em{font-style:normal;margin-left:6px;background:rgba(0,0,0,.18);border-radius:999px;padding:1px 7px;font-size:11.5px}
.aba:not(.on) em{background:var(--card2);color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.1}.kpi span{font-size:12px;color:var(--tx2)}
.kpi.alerta{border-color:rgba(239,68,68,.55)}.kpi.alerta b{color:#fca5a5}
.vazio{color:var(--tx2);text-align:center;padding:46px 10px;border:1px dashed var(--line);border-radius:16px}
/* posts */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media(max-width:400px){.grade{grid-template-columns:1fr}}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.post.st-erro{border-color:rgba(239,68,68,.6)}
.midia{position:relative;background:#000;aspect-ratio:4/5}
.midia.vert{aspect-ratio:9/16;max-height:560px}
.trilho{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.trilho::-webkit-scrollbar{display:none}
.trilho img,.trilho video{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:start;background:#000}
.cont{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);border-radius:999px;padding:3px 9px;font-size:11.5px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:18px;display:grid;place-items:center}
.nav.e{left:8px}.nav.d{right:8px}
.corpo{padding:14px 15px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.s-aguardando{background:rgba(234,179,8,.16);border-color:rgba(234,179,8,.4);color:#fde047}
.s-aprovado{background:rgba(61,123,255,.18);border-color:rgba(61,123,255,.45);color:#a9c4ff}
.s-ajustar{background:rgba(249,115,22,.16);border-color:rgba(249,115,22,.45);color:#fdba74}
.s-publicado{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.45);color:#86efac}
.s-reprovado{background:rgba(100,116,139,.2);color:#94a3b8}
.s-erro{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.5);color:#fca5a5}
.post h3{font-size:16px;font-weight:700;line-height:1.3}
.legenda{color:var(--tx2);font-size:13px;line-height:1.5;white-space:pre-line;max-height:7.5em;overflow:hidden;position:relative}
.legenda.aberta{max-height:none}
.mais{background:none;border:none;color:var(--ac);font-size:12.5px;padding:0;align-self:flex-start}
.hash{color:var(--ac2);font-size:12.5px}
.obs{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--tx2)}
.obs b{color:var(--tx)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.acoes .btn{flex:1}
.ajuste{display:none;flex-direction:column;gap:8px}
.ajuste.on{display:flex}
.ajuste textarea{width:100%;min-height:80px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical;outline:none}
.ajuste textarea:focus{border-color:var(--ac)}
/* agenda */
.dia{margin-bottom:14px}
.dia h4{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx2);margin-bottom:8px;font-family:"JetBrains Mono",monospace;font-weight:500}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:8px}
.item img{width:46px;height:58px;object-fit:cover;border-radius:8px;flex:none;background:#000}
.item .ph{width:46px;height:58px;border-radius:8px;flex:none;background:var(--card2);display:grid;place-items:center;color:var(--tx2);font-size:18px}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-size:14px;font-weight:600}.item .tx span{font-size:12px;color:var(--tx2)}
/* arquivos */
.arqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.arq{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--tx)}
.arq .th{aspect-ratio:4/5;background:#000 center/cover no-repeat;position:relative}
.arq .th i{position:absolute;inset:auto 6px 6px auto;background:rgba(0,0,0,.65);border-radius:999px;padding:2px 8px;font-size:11px;font-style:normal}
.arq div.l{padding:8px 10px;font-size:11.5px;color:var(--tx2)}
/* equipe */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros input{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.clis{display:flex;flex-direction:column;gap:10px}
.cli{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;text-align:left;width:100%}
.cli:hover{border-color:var(--ac)}
.cli.prob{border-color:rgba(239,68,68,.55)}
.cli .n{font-size:16px;font-weight:700}.cli .n small{font-weight:500;color:var(--tx2);font-size:12.5px;margin-left:6px}
.sinais{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sin{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--tx2)}
.sin.ok{color:#86efac;border-color:rgba(34,197,94,.4)}.sin.no{color:#fca5a5;border-color:rgba(239,68,68,.45)}.sin.at{color:#fde047;border-color:rgba(234,179,8,.45)}
.probs{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.probs div{font-size:12.5px;color:#fca5a5}
.cli .lado{text-align:right;font-size:12px;color:var(--tx2);display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ac);color:#0B0C0E;font-weight:700;border-radius:999px;padding:10px 18px;opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.ruim{background:#ef4444;color:#fff}
.voltar{background:none;border:none;color:var(--tx2);font-size:13px;margin-bottom:8px;padding:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:grid;place-items:center;padding:16px}
.modal>div{width:min(440px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px;max-height:90vh;overflow:auto}
.modal h3{font-size:18px;margin-bottom:4px}.modal p{color:var(--tx2);font-size:13px;margin-bottom:14px}
.modal select,.modal input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.modal pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:"JetBrains Mono",monospace;font-size:12.5px;margin-bottom:12px}
.modal .acoes{margin-top:14px}
/* saúde financeira (só equipe) */
.sin.fin-verde{color:#86efac;border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.sin.fin-amarelo{color:#fde047;border-color:rgba(234,179,8,.5);background:rgba(234,179,8,.1)}
.sin.fin-vermelho{color:#fca5a5;border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.12)}
.fin{width:100%;border-collapse:collapse;font-size:13px}
.fin th{font-weight:600;color:var(--tx2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.fin td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.fin td.n,.fin th.n{text-align:right;font-family:"JetBrains Mono",monospace}
.fin tr.verde td:first-child{box-shadow:inset 3px 0 0 var(--ok)}.fin tr.amarelo td:first-child{box-shadow:inset 3px 0 0 var(--wa)}.fin tr.vermelho td:first-child{box-shadow:inset 3px 0 0 var(--er)}.fin tr.cinza td:first-child{box-shadow:inset 3px 0 0 #64748b}
.finbox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-x:auto;margin-bottom:8px}
.legfin{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin:8px 0 22px}
.modal .grade2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* visão geral da equipe */
.sec{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--tx2);font-family:"JetBrains Mono",monospace;font-weight:500;margin:4px 0 8px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}@media(max-width:900px){.kpis.k5{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.kpis.k5{grid-template-columns:repeat(2,1fr)}}
.kpi.kb{text-align:left;cursor:pointer;transition:.15s;position:relative}.kpi.kb:hover{border-color:var(--ac);transform:translateY(-1px)}
.kpi.kb::after{content:"›";position:absolute;right:12px;top:12px;color:var(--tx2);font-size:16px}
@media(max-width:560px){.kpi.din b{font-size:18px}}
.kpi.atencao{border-color:rgba(234,179,8,.5)}.kpi.atencao b{color:#fde047}
.painel2{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-top:6px}@media(max-width:860px){.painel2{grid-template-columns:1fr}}
.caixa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.caixa h3{font-size:15px;margin-bottom:10px}
.acao{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:13px}
.acao i{margin-left:auto;font-style:normal;color:var(--tx2)}.acao:hover{border-color:var(--ac)}
.acao.er{border-left:3px solid var(--er)}.acao.wa{border-left:3px solid var(--wa)}
.barra{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--bg2);gap:2px}
.barra i{display:block}.b-verde{background:var(--ok)}.b-amarelo{background:var(--wa)}.b-vermelho{background:var(--er)}.b-cinza{background:#64748b}
.legfin button.sin{background:none;cursor:pointer}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:130px;align-items:end}
.cols div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.cols i{display:block;width:100%;max-width:34px;background:linear-gradient(var(--ac),rgba(200,255,77,.35));border-radius:8px 8px 3px 3px;min-height:3px}
.cols b{font-size:12px}.cols span{font-size:11px;color:var(--tx2)}
.qlista{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.qi{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.qi img,.qi .ph{width:40px;height:50px;object-fit:cover;border-radius:8px;flex:none;background:#000;display:grid;place-items:center;color:var(--tx2)}
.qt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.qt b{font-size:13.5px}.qt span{font-size:12px;color:var(--tx2)}
.qa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.qa .btn{padding:7px 12px;font-size:12px}
.fin tr[data-cid]:hover td{background:var(--card2)}
/* simulador */
.simg{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}@media(max-width:860px){.simg{grid-template-columns:1fr}}
.stp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stp b{display:block;font-size:14px}.stp span{font-size:12px;color:var(--tx2)}
.ctl{display:flex;align-items:center;gap:6px}.ctl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:18px}
.ctl input{width:64px;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 4px;font-weight:700}
.caixa .campo input,.caixa select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.res .rot{font-size:12px;color:var(--tx2)}.res .preco{font-size:38px;font-weight:800;letter-spacing:-1px;color:var(--ac);line-height:1.1}.res .preco small{font-size:14px;color:var(--tx2);font-weight:600;margin-left:4px}
.res p{color:var(--tx2);font-size:12.5px;margin:4px 0 10px}
.caixa .grade2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* números do cliente */
.kpis.kc{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.modal .grade2 label span,.modal label.campo span{font-size:12px;color:var(--tx2)}

/* ===== versão com barra lateral ===== */
:root{--lw:252px}
#telaPainel{padding-left:var(--lw)}
#lateral{position:fixed;left:0;top:0;bottom:0;width:var(--lw);background:var(--bg2);border-right:1px solid var(--line);z-index:30;display:flex;flex-direction:column;overflow:hidden}
#lateral .lmarca{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#lateral .lmarca .marca{margin:0}#lateral .lmarca svg{width:34px;height:34px}#lateral .lmarca b{font-size:18px}
#lateral .lnav{flex:1;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
#lateral .lt{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--tx2);padding:10px 10px 6px}
#lateral .li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;color:var(--tx2);font-size:13.5px;font-weight:600;text-decoration:none}
#lateral .li i{font-style:normal;width:20px;text-align:center;flex:none;font-size:14px}
#lateral .li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lateral .li em{font-style:normal;font-size:11px;background:var(--card2);color:var(--tx);border-radius:999px;padding:1px 7px}
#lateral .li em.al{background:rgba(239,68,68,.2);color:#fca5a5}
#lateral .li:hover{background:var(--card);color:var(--tx)}
#lateral .li.on{background:rgba(200,255,77,.12);color:var(--ac)}
#lateral .lsub{margin:2px 0 6px 18px;padding-left:8px;border-left:1px solid var(--line)}
#lateral .lsub .li{padding:7px 10px;font-size:13px}
#lateral .bola{width:9px!important;height:9px;border-radius:50%;margin:0 5px;background:#64748b}
.bola.f-verde{background:var(--ok)!important}.bola.f-amarelo{background:var(--wa)!important}.bola.f-vermelho{background:var(--er)!important}
#lateral .lbaixo{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:flex;flex-direction:column;gap:2px}
#lateral .lbaixo .btn{margin-bottom:8px}
.topo .in{max-width:none;padding:12px 24px}.topo .marca,.topo #selCliente,.topo .sair{display:none!important}
#tituloTopo{font-size:16px;font-weight:800}
#abreLat{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;color:var(--tx);font-size:18px}
main{max-width:1680px;margin:0;padding:22px 32px 60px}

<script>
const SUPABASE_URL = "https://wmfevnhfkgrwvernyqcf.supabase.co";
const SUPABASE_KEY = "sb_publishable_UHvzB_OuCtbda_rGxunDXw_WGBIE6wH";
const TIPO = { carrossel: "Carrossel", post_unico: "Post", reels: "Reels", story: "Story" };
const STATUS = { aguardando: "Aguardando aprovação", aprovado: "Aprovado · agendado", ajustar: "Em ajuste", publicado: "Publicado", reprovado: "Reprovado", erro: "Erro na publicação" };
const PAUTA = { planejada: "Planejada", em_producao: "Em produção", produzida: "Produzida", descartada: "Descartada" };
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const H = 3600e3;
let fin = {}, param = null;
let sb, eu = null, clientes = [], posts = [], pautas = [], atual = null, aba = "aprovar", modo = "cliente", filtroProb = false, recarregar = null;

function dataBR(iso, comHora = true) {
  if (!iso) return "—";
  const d = new Date(iso.length === 10 ? iso + "T12:00:00-03:00" : iso);
  const o = { weekday: "short", day: "2-digit", month: "2-digit", timeZone: "America/Sao_Paulo" };
  if (comHora) Object.assign(o, { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleString("pt-BR", o).replace(".", "");
}
function ha(iso) {
  if (!iso) return "nunca";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "agora"; if (m < 60) return `há ${m} min`;
  const h = Math.round(m / 60); if (h < 48) return `há ${h} h`;
  return `há ${Math.round(h / 24)} dias`;
}
function toast(t, ruim) { const e = $("#toast"); e.textContent = t; e.className = "toast on" + (ruim ? " ruim" : ""); clearTimeout(e._t); e._t = setTimeout(() => (e.className = "toast"), 2600); }
function mostrar(t) { $("#telaLogin").hidden = t !== "login"; $("#telaPainel").hidden = t !== "painel"; }
function vivo(on, txt) { $("#vivo").classList.toggle("on", on); $("#vivoTxt").textContent = txt; }

// ---------- sessão ----------
async function iniciar() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await sb.auth.getSession();
  if (data.session) entrar(); else mostrar("login");
}
$("#formLogin").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#erroLogin").textContent = ""; $("#btnEntrar").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#senha").value });
  $("#btnEntrar").disabled = false;
  if (error) { $("#erroLogin").textContent = "Não consegui entrar. Confira o e-mail e a senha."; return; }
  entrar();
});
$("#sair").onclick = async () => { await sb.auth.signOut(); location.reload(); };
$("#trocarSenha").onclick = async () => {
  const n = prompt("Digite a nova senha (mínimo 8 caracteres):");
  if (!n) return; if (n.length < 8) return toast("A senha precisa ter pelo menos 8 caracteres", true);
  const { error } = await sb.auth.updateUser({ password: n });
  error ? toast("Não consegui trocar a senha: " + error.message, true) : toast("Senha alterada!");
};

async function entrar() {
  mostrar("painel");
  const { data, error } = await sb.rpc("lumen_eu");
  if (error) { $("#conteudo").innerHTML = `<div class="vazio">Erro ao abrir o painel: ${esc(error.message)}</div>`; return; }
  eu = data;
  if (!eu.equipe && !eu.clientes.length) {
    $("#conteudo").innerHTML = '<div class="vazio">Seu acesso ainda não foi liberado. Fale com a equipe da Lúmen.</div>'; vivo(false, ""); return;
  }
  $("#papel").textContent = eu.equipe ? "PAINEL DA EQUIPE" : "PAINEL DO CLIENTE";
  await carregar();
  const prm = new URLSearchParams(location.search).get("cliente");
  if (eu.equipe && !prm) { modo = "equipe"; } else { modo = "cliente"; atual = clientes.find((c) => c.slug === prm) || clientes[0]; }
  montarSeletor(); render();
  sb.channel("lumen-painel")
    .on("postgres_changes", { event: "*", schema: "public", table: "lumen_posts" }, agendarRecarga)
    .on("postgres_changes", { event: "*", schema: "public", table: "lumen_clientes" }, agendarRecarga)
    .subscribe((s) => vivo(s === "SUBSCRIBED", s === "SUBSCRIBED" ? "ao vivo" : "reconectando…"));
  setInterval(agendarRecarga, 5 * 60e3);
}
function agendarRecarga() { clearTimeout(recarregar); recarregar = setTimeout(async () => { await carregar(); render(true); }, 700); }

async function carregar() {
  const desde = new Date(Date.now() - 120 * 864e5).toISOString();
  const [c, p, a] = await Promise.all([
    sb.from("lumen_clientes").select("id,slug,nome,instagram,pacote,status,telegram_chat_id,ig_user_id,horario_publicacao,ultimo_ciclo,ultimo_erro,ultimo_erro_em").order("nome"),
    sb.from("lumen_posts").select("*").gte("criado_em", desde).order("data_publicacao", { ascending: true }),
    sb.from("lumen_pautas").select("*").gte("data_prevista", new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10)).order("data_prevista"),
  ]);
  if (c.error || p.error || a.error) { toast("Erro ao carregar dados", true); return; }
  clientes = c.data; posts = p.data; pautas = a.data;
  if (eu?.equipe) {
    const [f, pr] = await Promise.all([sb.from("lumen_financeiro").select("*"), sb.from("lumen_custos_param").select("params").eq("id", 1).maybeSingle()]);
    fin = Object.fromEntries((f.data || []).map((x) => [x.cliente_id, x])); param = pr.data?.params || null;
  }
  if (atual) atual = clientes.find((x) => x.id === atual.id) || atual;
}

function montarSeletor() {
  const s = $("#selCliente");
  if (clientes.length < 2 && !eu.equipe) { s.hidden = true; return; }
  s.hidden = false;
  s.innerHTML = (eu.equipe ? '<option value="">Todos os clientes</option>' : "") + clientes.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join("");
  s.value = modo === "equipe" ? "" : String(atual?.id || "");
  s.onchange = () => { if (!s.value) { modo = "equipe"; atual = null; } else { modo = "cliente"; atual = clientes.find((c) => String(c.id) === s.value); aba = "aprovar"; } history.replaceState(null, "", modo === "equipe" ? location.pathname : "?cliente=" + atual.slug); render(); };
}

// ---------- saúde (equipe) ----------
function problemas(c) {
  const ps = posts.filter((p) => p.cliente_id === c.id), out = [];
  const ativo = ["ativo", "implantacao"].includes(c.status);
  const erros = ps.filter((p) => p.status === "erro");
  if (erros.length) out.push(`${erros.length} post(s) com erro na publicação`);
  const atrasados = ps.filter((p) => p.status === "aprovado" && new Date(p.data_publicacao) < Date.now() - 1.5 * H);
  if (atrasados.length) out.push(`${atrasados.length} post(s) aprovado(s) e atrasado(s)`);
  if (c.ultimo_erro && c.ultimo_erro_em && Date.now() - new Date(c.ultimo_erro_em) < 24 * H) out.push(`Último erro (${ha(c.ultimo_erro_em)}): ${c.ultimo_erro}`);
  if (ativo && !c.telegram_chat_id) out.push("Telegram de aprovação não vinculado");
  if (ativo && !c.ig_user_id) out.push("Instagram não conectado (não publica sozinho)");
  if (ativo && c.telegram_chat_id && (!c.ultimo_ciclo || Date.now() - new Date(c.ultimo_ciclo) > 2.5 * H)) out.push(`Robô sem rodar ${c.ultimo_ciclo ? ha(c.ultimo_ciclo) : "ainda"}`);
  return out;
}

// ---------- saúde financeira (equipe) ----------
const brl = (v) => (v ?? 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const mesSP = (iso) => iso ? new Date(iso.length === 10 ? iso + "T12:00:00-03:00" : iso).toLocaleDateString("en-CA", { timeZone: "America/Sao_Paulo" }).slice(0, 7) : "";
const MES_ATUAL = () => mesSP(new Date().toISOString());
const FAIXA = { verde: "Saudável", amarelo: "Atenção", vermelho: "Abaixo do markup", cinza: "Sem preço" };
function custoUnit(tipo, f) {
  const t = (param?.tipos || {})[tipo === "reels" && f?.reels_avatar ? "reels_avatar" : tipo] || param?.tipos?.post_unico || { ia: 0, min: 0 };
  return Number(t.ia || 0) + Number(t.min || 0) / 60 * Number(param?.hora || 0);
}
function financeiro(c, mes = MES_ATUAL()) {
  if (!param) return null;
  const f = fin[c.id] || {}, hora = Number(param.hora || 0);
  const ps = posts.filter((p) => p.cliente_id === c.id && mesSP(p.data_publicacao || p.criado_em) === mes);
  const comPost = new Set(ps.map((p) => p.pauta_id).filter(Boolean));
  const pend = pautas.filter((a) => a.cliente_id === c.id && mesSP(a.data_prevista) === mes && !comPost.has(a.id) && ["planejada", "em_producao"].includes(a.status));
  const qtd = {}; ps.forEach((p) => (qtd[p.tipo] = (qtd[p.tipo] || 0) + 1));
  const ajustes = ps.reduce((s, p) => s + (p.ajustes || 0), 0);
  const pecas = ps.reduce((s, p) => s + custoUnit(p.tipo, f), 0);
  const cAjustes = ajustes * Number(param.minutos_ajuste || 0) / 60 * hora;
  const gestao = Number(param.gestao_min || 0) / 60 * hora, fixo = Number(param.fixo || 0);
  const realizado = pecas + cAjustes + gestao + fixo;
  const previsto = pend.reduce((s, a) => s + custoUnit(a.tipo, f), 0);
  const custo = realizado + previsto;
  const preco = Number(f.preco_mensal || 0), alvo = Number(f.markup_alvo || param.markup_padrao || 2.5);
  const markup = preco && custo ? preco / custo : null;
  const faixa = !preco ? "cinza" : markup >= alvo ? "verde" : markup >= alvo * Number(param.faixa_atencao || 0.85) ? "amarelo" : "vermelho";

const PRESETS = {
  start: { nome: "Start", carrossel: 4, post_unico: 4, story: 0, reels: 0 },
  essencial: { nome: "Essencial", carrossel: 8, post_unico: 4, story: 8, reels: 0 },
  diario: { nome: "Diário (food e varejo)", carrossel: 12, post_unico: 0, story: 30, reels: 4 },

function simNovo() { return { ...PRESETS.diario, preset: "diario", ajustes: 20, markup: Number(param?.markup_padrao || 2.8), implantacao: 0, cliente: "" }; }
function simCalc(s) {
  const hora = Number(param?.hora || 0), un = (t) => custoUnit(t, {});
  const tipos = ["carrossel", "post_unico", "story", "reels"];
  const pecas = tipos.reduce((a, t) => a + Number(s[t] || 0) * un(t), 0);
  const nFeed = Number(s.carrossel || 0) + Number(s.post_unico || 0) + Number(s.reels || 0);
  const ajustes = nFeed * Number(s.ajustes || 0) / 100 * Number(param?.minutos_ajuste || 0) / 60 * hora;
  const gestao = Number(param?.gestao_min || 0) / 60 * hora + Number(param?.fixo || 0);
  const custo = pecas + ajustes + gestao, mk = Number(s.markup || 0);
  const preco = custo * mk, sugerido = preco ? Math.ceil(preco / 10) * 10 - 3 : 0;
  const lucro = sugerido * (1 - Number(param?.imposto || 0)) - custo;
  const total = tipos.reduce((a, t) => a + Number(s[t] || 0), 0);
  return { pecas, ajustes, gestao, custo, preco, sugerido, lucro, mkReal: custo ? sugerido / custo : 0, total, dia: sugerido / 30, porPeca: total ? sugerido / total : 0 };
}

function ligarSimulador() {
  const salva = () => { try { localStorage.setItem("lumen_sim", JSON.stringify(sim)); } catch (e) {} renderEquipe(); };
  document.querySelectorAll("[data-pre]").forEach((b) => (b.onclick = () => { if (b.dataset.pre) Object.assign(sim, PRESETS[b.dataset.pre], { preset: b.dataset.pre }); else sim.preset = ""; salva(); }));
  document.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { const k = b.dataset.m; sim[k] = Math.max(0, Number(sim[k] || 0) + Number(b.dataset.d) * (k === "story" ? 5 : 1)); sim.preset = ""; salva(); }));
  document.querySelectorAll("[data-q]").forEach((i) => (i.onchange = () => { sim[i.dataset.q] = Math.max(0, Number(i.value || 0)); sim.preset = ""; salva(); }));
  $("#sAj").onchange = (e) => { sim.ajustes = Number(e.target.value || 0); salva(); };
  $("#sMk").onchange = (e) => { sim.markup = Number(e.target.value || 0); salva(); };
  $("#sCli").onchange = (e) => { sim.cliente = e.target.value; try { localStorage.setItem("lumen_sim", JSON.stringify(sim)); } catch (x) {} };
  $("#sCopiar").onclick = async () => {
    const r = simCalc(sim), it = [sim.carrossel && `${sim.carrossel} carrosséis`, sim.post_unico && `${sim.post_unico} posts`, sim.story && `${sim.story} stories`, sim.reels && `${sim.reels} Reels`].filter(Boolean).join(", ");
    const t = `Pacote Lúmen${sim.preset ? " " + PRESETS[sim.preset].nome : " personalizado"}\n• ${it} por mês\n• Legendas, hashtags e datas do seu segmento\n• Aprovação pelo celular antes de publicar\nInvestimento: ${brl(r.sugerido)}/mês (menos de ${brl(Math.ceil(r.dia))} por dia)`;
    try { await navigator.clipboard.writeText(t); toast("Proposta copiada"); } catch (e) { modal(`<h3>Proposta</h3><pre>${esc(t)}</pre>`); }

    e.target.disabled = false; if (error) return toast(error.message, true);
    fin[id] = row; toast("Preço aplicado a " + c.nome); renderEquipe();
  };
}

function lerImagem(file, max = 1100) {
  return new Promise((ok, erro) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", 0.85); ok({ url, mime: "image/jpeg", data: url.split(",")[1] });
    }; im.onerror = erro; im.src = r.result; };
    r.onerror = erro; r.readAsDataURL(file);
  });
}

    if (!confirm("Gerar uma nova senha provisória para " + b.dataset.acSenha + "? A senha antiga deixa de funcionar.")) return;
    const r = await chamarAcesso({ acao: "nova_senha", email: b.dataset.acSenha }); if (r) mostrarCredencial(r.email, r.senha);
  }));
  box.querySelectorAll("[data-ac-rem]").forEach((b) => (b.onclick = async () => {
    if (!confirm("Remover o acesso de " + b.dataset.acRem + " ao painel?")) return;

}
async function chamarAcesso(corpo) {
  const { data, error } = await sb.functions.invoke("lumen-acesso", { body: corpo });
  if (error) { let m = error.message; try { m = (await error.context.json()).erro || m; } catch (e) {} toast(m, true); return null; }
  if (data?.erro) { toast(data.erro, true); return null; }
  return data;
}
function modal(html) {
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div>${html}</div>`;
  m.onclick = (e) => { if (e.target === m) m.remove(); }; document.body.appendChild(m); return m;
}

  const m = modal(`<h3>Novo acesso</h3><p>Cria o login e gera uma senha provisória.</p>

function numerosCliente(ps, pend) {
  const n = (st) => ps.filter((p) => p.status === st).length, mes = MES_ATUAL();

  const prev = pautas.filter((a) => a.cliente_id === atual.id && ["planejada", "em_producao"].includes(a.status)).length;
  const k = (a, num, rot, cls = "", rolar = "") => `<button class="kpi kb ${cls}" data-aba="${a}" ${rolar ? `data-rolar="${rolar}"` : ""}><b>${num}</b><span>${rot}</span></button>`;
  const r = eu.equipe ? financeiro(atual) : null;
  return `<div class="kpis kc">${k("aprovar", pend.length, eu.equipe ? "aguardando aprovação" : "para você aprovar", pend.length ? "atencao" : "")}
    ${k("aprovar", n("ajustar"), "em ajuste", n("ajustar") ? "atencao" : "", "emAndamento")}${k("agenda", n("aprovado"), "aprovados e agendados")}${k("agenda", prev, "pautas previstas")}
    ${k("publicados", pubMes, "publicados no mês")}${eu.equipe && n("erro") ? k("aprovar", n("erro"), "erros de publicação", "alerta") : ""}
    ${r ? k("implantacao", r.faixa === "cinza" ? "—" : fmtX(r.markup), FAIXA[r.faixa] + (r.preco ? " · " + brl(r.preco) : ""), r.faixa === "vermelho" ? "alerta" : r.faixa === "amarelo" ? "atencao" : "") : ""}</div>`;
}
function renderCliente(silencioso) {

  // preserva ajustes digitados
  const rascunhos = {}; document.querySelectorAll(".ajuste textarea").forEach((t) => { if (t.value) rascunhos[t.dataset.id] = t.value; });
  const abertos = [...document.querySelectorAll(".ajuste.on")].map((d) => d.dataset.id);
  const pr = eu.equipe ? problemas(atual) : [];
  let corpo = "";
  if (aba === "aprovar") corpo = pend.length || emAndamento.length
    ? `${pend.length ? `<div class="grade">${pend.map(cardPost).join("")}</div>` : '<div class="vazio">Nada aguardando sua aprovação agora. 🎉</div>'}
       ${emAndamento.length ? `<h3 id="emAndamento" style="margin:22px 0 10px;font-size:15px">Em andamento</h3><div class="grade">${emAndamento.map(cardPost).join("")}</div>` : ""}`
    : '<div class="vazio">Nada aguardando sua aprovação agora. Os próximos posts chegam aqui e no Telegram um dia antes de irem ao ar.</div>';

  $("#conteudo").innerHTML = `

    <div class="cab"><div><h2>${esc(atual.nome)}</h2><p>${esc(atual.instagram || "")} · Pacote ${esc(atual.pacote || "—")} · publicações às ${esc(atual.horario_publicacao || "18:30")}</p></div></div>
    ${pr.length ? `<div class="obs" style="border-color:rgba(239,68,68,.5);margin-bottom:14px">${pr.map((x) => `<div style="color:#fca5a5">⚠ ${esc(x)}</div>`).join("")}</div>` : ""}

      <div class="e">${esc([l.segmento, l.cidade, l.pacote_sugerido && "pacote " + l.pacote_sugerido].filter(Boolean).join(" · ") || "Conversa iniciada")}</div></div>
      <div class="lado"><span class="tag ld-s-${esc(l.status || "novo")}">${esc(LD_NOME[l.status] || "Novo")}</span>${l.temperatura ? `<span class="tag ld-t-${esc(l.temperatura)}">${esc(l.temperatura)}</span>` : ""}<span>${ldData(l.atualizado_em)}</span></div>
      ${l.resumo ? `<div class="r">${esc(l.resumo)}</div>` : ""}</button>`).join("") : `<div class="vazio">${leads.length ? "Nenhum lead com esses filtros." : "Ainda não chegou nenhum lead. Quando alguém conversar com a Lia, ele aparece aqui na hora."}</div>`}</div>`;
  document.querySelectorAll("[data-ldf]").forEach((b) => (b.onclick = () => { ldFiltro = b.dataset.ldf; renderLeads(); }));
  document.querySelectorAll("[data-ld]").forEach((b) => (b.onclick = () => ldAbrir(Number(b.dataset.ld))));
  ["#ldBusca", "#ldTemp", "#ldPer"].forEach((sel) => ($(sel).oninput = () => renderLeads()));
  if (foco === "ldBusca") { const i = $("#ldBusca"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
function ldMontarFicha() {
  if ($("#ldFicha")) return;
  document.body.insertAdjacentHTML("beforeend", `<div class="ld-fundo" id="ldFundo"></div><aside class="ld-ficha" id="ldFicha" aria-label="Ficha do lead">
    <div class="ld-ftopo"><div><h2 id="ldNome"></h2><p id="ldSub"></p></div><button class="ld-x" id="ldX" aria-label="Fechar">×</button></div>
    <div class="ld-fcorpo"><div class="ld-acoes" id="ldAcoes"></div>
      <div class="ld-bloco"><h3>Status</h3><div class="ld-st" id="ldSt"></div></div>
      <div class="ld-bloco"><h3>Resumo da Lia</h3><p id="ldResumo" style="color:var(--tx2);font-size:13.5px;line-height:1.5"></p></div>
      <div class="ld-bloco"><h3>Dados</h3><dl class="ld-dados" id="ldDados"></dl></div>
      <div class="ld-bloco"><h3>Anotações</h3><textarea class="ld-notas" id="ldNotas" placeholder="Ex.: liguei na segunda, pediu proposta do Diário…"></textarea><div class="ld-salvo" id="ldSalvo"></div></div>
      <div class="ld-bloco"><h3>Conversa com a Lia</h3><div class="ld-conv" id="ldConv"></div></div></div></aside>`);
  const fechar = () => { $("#ldFundo").classList.remove("on"); $("#ldFicha").classList.remove("on"); ldAberto = null; };
  $("#ldX").onclick = fechar; $("#ldFundo").onclick = fechar;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ldAberto) fechar(); });
  $("#ldNotas").oninput = () => { $("#ldSalvo").textContent = "Salvando…"; clearTimeout(ldTimer); ldTimer = setTimeout(() => ldSalvar({ anotacoes: $("#ldNotas").value }), 800); };
}
async function ldAbrir(id) {
  const l = leads.find((x) => x.id === id); if (!l) return;
  ldMontarFicha(); ldAberto = l;
  $("#ldFundo").classList.add("on"); $("#ldFicha").classList.add("on");
  ldPreencher(l, true);
  $("#ldConv").innerHTML = '<div class="vazio" style="padding:10px">Carregando conversa…</div>';
  const { data } = await sb.from("comercial_mensagens").select("*").eq("sessao", l.sessao).order("criado_em");
  $("#ldConv").innerHTML = (data || []).length ? "" : '<div class="vazio" style="padding:10px">Sem mensagens.</div>';
  (data || []).forEach((m) => ldMsg(m, false));
}
function ldMsg(m, rolar) {
  const d = document.createElement("div"); d.className = "ld-msg " + (m.papel === "lead" ? "l" : "v");
  d.innerHTML = esc(m.texto) + `<small>${m.papel === "lead" ? "Lead" : "Lia"} · ${ldData(m.criado_em)}</small>`;
  $("#ldConv").querySelector(".vazio")?.remove(); $("#ldConv").appendChild(d);
  if (rolar) d.scrollIntoView({ behavior: "smooth", block: "end" });
}
function ldPreencher(l, notas) {
  if (!l) return; ldAberto = l;
  $("#ldNome").textContent = l.nome || "Sem nome";
  $("#ldSub").textContent = [l.empresa, l.cidade, "chegou " + ldData(l.criado_em)].filter(Boolean).join(" · ");
  const w = ldWhats(l.whatsapp);
  $("#ldAcoes").innerHTML = (w ? `<a class="btn ld-wpp" href="${w}" target="_blank" rel="noopener">WhatsApp ${esc(l.whatsapp)}</a>` : "")
    + (l.email ? `<a class="btn" href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : "")
    + (l.instagram ? `<a class="btn" href="https://instagram.com/${esc(String(l.instagram).replace(/^@/, ""))}" target="_blank" rel="noopener">${esc(l.instagram)}</a>` : "")
    || '<span style="color:var(--tx2);font-size:13px">O lead ainda não deixou contato.</span>';
  $("#ldSt").innerHTML = LD_ST.map(([v, n]) => `<button class="${(l.status || "novo") === v ? "on" : ""}" data-v="${v}">${n}</button>`).join("");
  $("#ldSt").querySelectorAll("button").forEach((b) => (b.onclick = () => ldSalvar({ status: b.dataset.v, status_em: new Date().toISOString() })));
  $("#ldResumo").textContent = l.resumo || "A Lia ainda não fez um resumo deste lead.";
  const campos = [["Segmento", l.segmento], ["Objetivo", l.objetivo], ["Pacote provável", l.pacote_sugerido], ["Temperatura", l.temperatura], ["Pediu contato", l.quer_contato ? "sim" : "não"], ["Canal", l.canal], ["Origem", l.origem], ["Mensagens", l.total_mensagens]];
  $("#ldDados").innerHTML = campos.filter(([, v]) => v !== null && v !== undefined && v !== "").map(([a, v]) => `<dt>${a}</dt><dd>${esc(v)}</dd>`).join("");
  if (notas) { $("#ldNotas").value = l.anotacoes || ""; $("#ldSalvo").textContent = ""; }
}
async function ldSalvar(campos) {
  if (!ldAberto) return;
  Object.assign(ldAberto, campos); const i = leads.findIndex((l) => l.id === ldAberto.id); if (i >= 0) leads[i] = { ...leads[i], ...campos };
  ldPreencher(ldAberto, false); renderLeads(); montarLateral();
  const { error } = await sb.from("comercial_leads").update(campos).eq("id", ldAberto.id);
  $("#ldSalvo").textContent = error ? "Não salvou: " + error.message : "Salvo às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

// recolher menu e tema (lembra a escolha neste navegador)
try { if (localStorage.getItem("lumen_lat_mini") === "1") document.body.classList.add("lat-mini"); if (localStorage.getItem("lumen_tema") === "claro") document.body.classList.add("claro"); } catch (e) {}
const marcaTema = () => { const t = $("#tema"); if (t) t.textContent = document.body.classList.contains("claro") ? "☾" : "☀"; };
marcaTema();
$("#recolher").onclick = () => { const m = document.body.classList.toggle("lat-mini"); $("#recolher").title = m ? "Expandir menu" : "Recolher menu"; try { localStorage.setItem("lumen_lat_mini", m ? "1" : "0"); } catch (e) {} };
$("#tema").onclick = () => { const c = document.body.classList.toggle("claro"); marcaTema(); try { localStorage.setItem("lumen_tema", c ? "claro" : "escuro"); } catch (e) {} };

iniciar();
</script>
</body>
</html>
