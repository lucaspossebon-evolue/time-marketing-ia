<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Lúmen · Calendário de Conteúdo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fredoka:wght@500;600;700&family=Playfair+Display:wght@700;800&family=Sora:wght@600;700;800&family=Cormorant+Garamond:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Lúmen: fundo grafite, acento lima da marca. Layout: seletor de negócio > resumo do plano > calendário | perfil no Instagram */
:root{
  --bg:#0B0C0E; --bg2:#111316; --card:#16181C; --card2:#1c1f24; --line:#2A2E35;
  --tx:#F2F4F0; --tx2:#A3A8A0; --ac:#C8FF4D; --pub:#22c55e; --agd:#3D7BFF;
  --fui:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --fmono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--fui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.topo{border-bottom:1px solid var(--line);background:rgba(11,12,14,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}
.topo .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px}.logo svg{width:32px;height:32px}
.logo b{font-size:18px;font-weight:700;letter-spacing:-.3px}.logo b i{color:var(--ac);font-style:normal}
.logo small{display:block;font-size:9.5px;letter-spacing:2px;color:var(--tx2)}
.negocios{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--tx2)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#0B0C0E;font-weight:700}
main{max-width:1180px;margin:0 auto;padding:20px 16px 70px;display:flex;flex-direction:column;gap:18px}
.resumo{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.resumo h1{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;text-wrap:balance}
.resumo p{color:var(--tx2);font-size:14px;margin-top:4px;max-width:62ch}
.aviso{font-size:12px;color:var(--tx2);border:1px dashed var(--line);border-radius:10px;padding:6px 10px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.kpi b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.kpi span{display:block;font-size:12px;color:var(--tx2)}
.vistas{display:flex;gap:6px}
.vistas .chip.on{background:var(--tx);border-color:var(--tx)}
.leg{display:flex;gap:12px;font-size:12.5px;color:var(--tx2);align-items:center;flex-wrap:wrap}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .sem{font-size:11px;letter-spacing:1.5px;color:var(--tx2);text-transform:uppercase;font-family:var(--fmono);padding:0 4px 2px}
.dia{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px;min-height:132px;display:flex;flex-direction:column;gap:6px;text-align:left;position:relative}
.dia:hover{border-color:#4a505a}
.dia.vazio{background:transparent;border-style:dashed;opacity:.35;pointer-events:none}
.dia.hoje{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.dia .num{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.dia .num em{font-style:normal;font-size:10px;font-weight:500;color:var(--tx2)}
.dia .st{width:7px;height:7px;border-radius:50%}
.miniaturas{display:flex;gap:4px;flex-wrap:wrap}
.mini{width:calc(50% - 2px);border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#000;padding:0;position:relative}
.mini.feed{aspect-ratio:4/5}.mini.vert{aspect-ratio:9/16}
.mini .ico{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);border-radius:999px;font-size:8.5px;padding:1px 5px;color:#fff;font-weight:700;letter-spacing:.3px}
.storyb{margin-top:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 8px 3px 3px;width:max-content;max-width:100%}
.storyb span.r{width:16px;height:16px;border-radius:50%;background:conic-gradient(#ffb03a,#ff3d77,#a64dff,#ffb03a);padding:2px;display:block;flex:none}
.storyb span.r i{display:block;width:100%;height:100%;border-radius:50%;background:var(--card2)}
@media(max-width:760px){
  .cal{gap:3px}.dia{min-height:70px;padding:4px;border-radius:8px}
  .dia .num em{display:none}.miniaturas .mini{width:100%}.miniaturas .mini:nth-child(n+2){display:none}
  .storyb{padding:2px;font-size:0;gap:0}.cal .sem{font-size:9px;letter-spacing:.5px;padding:0}
}
/* perfil instagram */
.perfilwrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:860px){.perfilwrap{grid-template-columns:1fr}}
.fone{background:#000;border:10px solid #1d2026;border-radius:44px;overflow:hidden;max-width:400px;width:100%;margin:0 auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.ig{background:#000;color:#f5f5f5;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;height:760px;overflow-y:auto;scrollbar-width:none}
.ig::-webkit-scrollbar{display:none}
.ig .hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;font-weight:700;font-size:18px;position:sticky;top:0;background:#000;z-index:2}
.ig .hdr span{display:flex;gap:16px;font-weight:400}
.ig .top{display:flex;align-items:center;gap:22px;padding:8px 16px}
.av{width:86px;height:86px;border-radius:50%;padding:3px;background:conic-gradient(#ffb03a,#ff3d77,#a64dff,#ffb03a);flex:none;border:none}
.av>div{width:100%;height:100%;border-radius:50%;border:3px solid #000;overflow:hidden;display:grid;place-items:center}
.ig .stats{display:flex;flex:1;justify-content:space-around;text-align:center;font-size:13px}
.ig .stats b{display:block;font-size:17px}
.ig .bio{padding:4px 16px 10px;font-size:13.5px;line-height:1.4}
.ig .bio b{display:block}.ig .bio .cat{color:#a8a8a8}.ig .bio a{color:#e0f1ff;text-decoration:none;font-weight:600}
.ig .btns{display:flex;gap:6px;padding:0 16px 12px}
.ig .btns div{flex:1;background:#262626;border-radius:8px;padding:7px;text-align:center;font-size:13.5px;font-weight:600}
.ig .btns div.seg{background:#0095f6}
.ig .dest{display:flex;gap:14px;padding:4px 16px 14px;overflow-x:auto;scrollbar-width:none}
.ig .dest div{text-align:center;font-size:11.5px;flex:none}
.ig .dest i{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;border:1px solid #363636;padding:3px;margin-bottom:4px}
.ig .dest i>span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}
.ig .tabs{display:flex;border-top:1px solid #262626}
.ig .tabs div{flex:1;text-align:center;padding:10px;font-size:12px;color:#8e8e8e;border-bottom:1px solid transparent}
.ig .tabs div.on{color:#f5f5f5;border-bottom-color:#f5f5f5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid button{border:none;padding:0;aspect-ratio:3/4;overflow:hidden;position:relative;background:#111}
.grid button .arte{height:100%;aspect-ratio:auto}
.grid .tp{position:absolute;top:5px;right:6px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.grid .ag{position:absolute;left:5px;bottom:5px;background:rgba(61,123,255,.9);color:#fff;border-radius:999px;font-size:9.5px;font-weight:700;padding:2px 6px}
.lado h2{font-size:20px;letter-spacing:-.3px}
.lado p{color:var(--tx2);font-size:14px;line-height:1.55;margin-top:6px;max-width:58ch}
.lado ul{margin:14px 0 0 18px;color:var(--tx2);font-size:14px;line-height:1.7}
.lado ul b{color:var(--tx)}
/* modais */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;display:grid;place-items:center;padding:14px}
.modal[hidden]{display:none}
.caixa{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:980px;width:100%;max-height:94vh;overflow:auto;position:relative}
.fechar{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;z-index:3}
.visor{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0}
@media(max-width:820px){.visor{grid-template-columns:1fr}}
.palco{background:#000;display:grid;place-items:center;padding:18px;position:relative;min-height:300px}
.quadro{position:relative;width:min(100%,460px);border-radius:12px;overflow:hidden}
.quadro.vert{width:min(100%,330px)}
.quadro .trilho{display:flex;transition:transform .35s ease}
.quadro .trilho>.arte{flex:0 0 100%}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.88);color:#111;font-size:18px;display:grid;place-items:center;z-index:2}
.nav.e{left:8px}.nav.d{right:8px}.nav[disabled]{opacity:0;pointer-events:none}
.pontos{display:flex;gap:5px;justify-content:center;margin-top:10px}
.pontos i{width:6px;height:6px;border-radius:50%;background:#555}.pontos i.on{background:#3d9bff}
.barras{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:3px;z-index:3}
.barras i{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.barras i b{display:block;height:100%;width:0;background:#fff}
.som{position:absolute;bottom:10px;left:10px;right:10px;z-index:3;display:flex;align-items:center;gap:8px;color:#fff;font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.eq{display:flex;gap:2px;align-items:flex-end;height:12px}.eq i{width:3px;background:#fff;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.tapz{position:absolute;inset:0;display:flex;z-index:2}.tapz button{flex:1;border:none;background:transparent}
.info{padding:22px 20px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.info .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid var(--line);background:var(--card2)}
.tag.pub{color:#86efac;border-color:rgba(34,197,94,.45)}.tag.agd{color:#a9c4ff;border-color:rgba(61,123,255,.5)}
.info h3{font-size:18px;line-height:1.3;text-wrap:balance}
.legenda{white-space:pre-line;color:var(--tx2);line-height:1.55;font-size:13.5px}
.legenda .h{color:#7fb2ff}
.dica{font-size:12.5px;color:var(--tx2);border-top:1px solid var(--line);padding-top:10px}
.lista{padding:22px;display:flex;flex-direction:column;gap:12px}
.lista h3{font-size:19px}
.itens{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:7px}
.item .th{border-radius:9px;overflow:hidden}
.item b{font-size:13px;line-height:1.3}.item span{font-size:11.5px;color:var(--tx2)}

/* ============ ARTES (escalam pelo tamanho do quadro: cqw) ============ */
.arte{container-type:inline-size;position:relative;width:100%;overflow:hidden;background:var(--a-bg);color:var(--a-tx);font-family:var(--a-fb)}
.arte.feed{aspect-ratio:4/5}.arte.vert{aspect-ratio:9/16}
.arte .tit{font-family:var(--a-fd);line-height:.95;letter-spacing:var(--a-ls);text-transform:var(--a-tt)}
.arte svg{display:block}
.arte .marca{position:absolute;left:6cqw;bottom:5cqw;font-family:var(--a-fd);font-size:4.2cqw;letter-spacing:.3cqw;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:1.6cqw}
.arte .marca i{width:2.4cqw;height:2.4cqw;border-radius:50%;background:var(--a-ac)}
.arte .pag{position:absolute;right:6cqw;bottom:5cqw;font-size:3.6cqw;opacity:.75;font-family:var(--a-fb);font-weight:700}
.arte .blob{position:absolute;border-radius:50%;background:var(--a-ac);opacity:var(--a-blob)}
/* capa */
.t-capa .tit{position:absolute;left:6cqw;right:6cqw;top:8cqw;font-size:13.5cqw}
.t-capa .sub{position:absolute;left:6cqw;right:20cqw;top:var(--subtop,48cqw);font-size:4.6cqw;font-weight:500;line-height:1.3;opacity:.9}
.t-capa .il{position:absolute;right:-4cqw;bottom:6cqw;width:76cqw}
.t-capa .faixa{position:absolute;left:6cqw;top:4cqw;font-size:3.4cqw;font-weight:700;letter-spacing:.4cqw;text-transform:uppercase;color:var(--a-ac2)}
/* item */
.t-item .n{position:absolute;left:6cqw;top:6cqw;font-family:var(--a-fd);font-size:26cqw;line-height:.85;color:var(--a-ac)}
.t-item .tit{position:absolute;left:6cqw;right:6cqw;top:38cqw;font-size:9.5cqw}
.t-item .tx{position:absolute;left:6cqw;right:30cqw;top:var(--txtop,64cqw);font-size:4.8cqw;line-height:1.35;opacity:.92}
.t-item .il{position:absolute;right:-6cqw;bottom:9cqw;width:46cqw}
/* oferta */
.t-oferta .tit{position:absolute;left:6cqw;right:6cqw;top:8cqw;font-size:11cqw}
.t-oferta .desc{position:absolute;left:6cqw;right:40cqw;top:34cqw;font-size:4.5cqw;line-height:1.35;opacity:.9}
.t-oferta .preco{position:absolute;left:6cqw;top:62cqw;background:var(--a-ac);color:var(--a-onac);border-radius:var(--a-rad);padding:2cqw 4cqw;transform:rotate(-3deg);font-family:var(--a-fd)}
.t-oferta .preco small{display:block;font-family:var(--a-fb);font-size:3.4cqw;font-weight:700;letter-spacing:.2cqw;text-transform:uppercase}
.t-oferta .preco b{font-size:13cqw;font-weight:400;line-height:1}
.t-oferta .il{position:absolute;right:-4cqw;bottom:8cqw;width:54cqw}
/* cta */
.t-cta{background:var(--a-ac)!important;color:var(--a-onac)!important}
.t-cta .tit{position:absolute;left:6cqw;right:6cqw;top:30cqw;font-size:15cqw}
.t-cta .tx{position:absolute;left:6cqw;right:6cqw;top:74cqw;font-size:5cqw;font-weight:700}
.t-cta .bt{position:absolute;left:6cqw;top:92cqw;background:var(--a-onac);color:var(--a-ac);border-radius:999px;padding:3cqw 6cqw;font-size:4.8cqw;font-weight:700}
.t-cta .marca i{background:var(--a-onac)}
/* stories e reels (9:16) */
.vert .tit{font-size:15cqw}
.s-txt{position:absolute;left:7cqw;right:7cqw}
.s-eye{font-size:4.2cqw;font-weight:700;letter-spacing:.5cqw;text-transform:uppercase;color:var(--a-ac2)}
.s-big{font-family:var(--a-fd);font-size:16cqw;line-height:.95;letter-spacing:var(--a-ls);text-transform:var(--a-tt);margin-top:2cqw}
.s-p{font-size:5.4cqw;line-height:1.35;margin-top:4cqw;opacity:.92}
.s-il{position:absolute;left:8cqw;right:8cqw;bottom:22cqw}
.s-chip{display:inline-block;background:var(--a-ac);color:var(--a-onac);border-radius:999px;padding:2.4cqw 5cqw;font-weight:700;font-size:5cqw;margin-top:5cqw}
.poll{position:absolute;left:10cqw;right:10cqw;top:96cqw;background:#fff;color:#111;border-radius:5cqw;padding:5cqw;box-shadow:0 2cqw 6cqw rgba(0,0,0,.25);font-family:"DM Sans",sans-serif}
.poll b{display:block;text-align:center;font-size:5.2cqw;margin-bottom:3cqw}
.poll div{display:flex;gap:3cqw}.poll span{flex:1;text-align:center;border:.5cqw solid #ddd;border-radius:3cqw;padding:3.2cqw 0;font-weight:700;font-size:5.2cqw}
.menu{list-style:none;margin-top:5cqw;display:flex;flex-direction:column;gap:2.6cqw}
.menu li{display:flex;justify-content:space-between;gap:3cqw;font-size:5.4cqw;border-bottom:.4cqw dashed currentColor;padding-bottom:2cqw;opacity:.95}
.menu li b{font-family:var(--a-fd);font-weight:400}
.cena{position:absolute;inset:0;opacity:0;animation:cena var(--dur) linear infinite;animation-delay:var(--del)}
.cena .il{position:absolute;left:6cqw;right:6cqw;bottom:20cqw;animation:zoom var(--dur) ease-in-out infinite;animation-delay:var(--del)}
@keyframes cena{0%{opacity:0}2%{opacity:1}23%{opacity:1}25%,100%{opacity:0}}
@keyframes zoom{0%{transform:scale(1.15) rotate(-2deg)}25%{transform:scale(1) rotate(1deg)}100%{transform:scale(1)}}
.parado .cena{animation:none;opacity:0}.parado .cena:first-of-type{opacity:1}.parado .cena .il{animation:none}
.play{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
.play i{width:16cqw;height:16cqw;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;font-size:7cqw;font-style:normal}
.arte .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.arte .veu-top{position:absolute;inset:0;background:linear-gradient(to bottom,var(--a-bg) 0%,var(--a-bg) var(--solid,30%),transparent var(--fade,62%))}
.arte .veu-esc{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.62) 0%,rgba(0,0,0,.08) 38%,rgba(0,0,0,.1) 55%,rgba(0,0,0,.72) 100%)}
.arte .moldura{position:absolute;right:6cqw;bottom:13cqw;width:48cqw;height:56cqw;border-radius:var(--a-rad);overflow:hidden;box-shadow:0 2cqw 6cqw rgba(0,0,0,.35)}
.arte .moldura img{width:100%;height:100%;object-fit:cover;display:block}
.arte.foto-txt{color:#fff}.arte.foto-txt .marca{color:#fff}
.cena .foto{animation:zoom var(--dur) ease-in-out infinite;animation-delay:var(--del)}
.parado .cena .foto{animation:none}
.menu-card{background:rgba(0,0,0,.55);backdrop-filter:blur(2px);border-radius:5cqw;padding:5cqw;margin-top:5cqw}
.fotoav{width:100%;height:100%;object-fit:cover;display:block}
.foto.fb{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 60% 38%,rgba(201,163,90,.55),transparent 62%),linear-gradient(160deg,#1d3029,#0d1612)}
.foto.fb svg{width:46%;max-height:70%;filter:drop-shadow(0 2cqw 4cqw rgba(0,0,0,.4))}
.moldura .foto.fb,.av .foto.fb,.dest .foto.fb{position:absolute}
.cta-final{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:6px}
.cta-final b{display:block;font-size:17px}.cta-final span{color:var(--tx2);font-size:13.5px}.cta-final a{text-decoration:none;padding:11px 18px}
@media (prefers-reduced-motion:reduce){.cena,.cena .il,.eq i{animation:none!important}.cena:first-of-type{opacity:1}}
</style>
</head>

const ANO = 2026, MES = 10; // novembro
const DIAS_CARR = [2,4,6,9,11,13,16,18,20,23,25,27], DIAS_REEL = [7,14,21,28];
const hojeReal = new Date(), HOJE = (hojeReal.getFullYear()===ANO && hojeReal.getMonth()===MES) ? hojeReal.getDate() : (hojeReal < new Date(ANO,MES,1) ? 0 : 99);

function montarAgenda(m){
  const pecas = [];
  DIAS_CARR.forEach((d,i)=>{ const c=m.carrosseis[i]; pecas.push({id:`${m.id}-c${i}`, dia:d, tipo:"carrossel", titulo:c.t, dados:c, idx:i}); });
  DIAS_REEL.forEach((d,i)=>{ const r={...m.reels[i], fotos:FOTOS[m.id].reels[i]}; pecas.push({id:`${m.id}-r${i}`, dia:d, tipo:"reels", titulo:r.t, dados:r}); });
  for(let d=1; d<=30; d++){
    const wd = new Date(ANO,MES,d).getDay();
    let s = [...m.stories[wd]]; s.foto = FOTOS[m.id].stories[wd];
    if(d===27){ s = ["contagem","Black Friday","É hoje!","Ofertas só até meia-noite","",""]; s.foto = FOTOS[m.id].contagem; }
    if(d===26){ s = ["contagem","Black Friday","Falta 1 dia","Amanhã tem preço especial","",""]; s.foto = FOTOS[m.id].capas[9]; }
    pecas.push({id:`${m.id}-s${d}`, dia:d, tipo:"story", titulo:`${s[1]}: ${s[2]}`, dados:s});
  }
  pecas.forEach(p=>{ p.status = p.dia <= HOJE ? "pub" : "agd"; p.hora = p.tipo==="story" ? "11:30" : p.tipo==="reels" ? "19:00" : "18:30"; });
  return pecas;
}

const styleVars = (o)=>Object.entries(o).map(([k,v])=>`${k}:${v}`).join(";");
function slidesDe(m,p){
  const c=p.dados, F=FOTOS[m.id], sl=[]; let k=p.idx||0;
  const prox = ()=>{ k++; const f=F.pool[(k*2+p.idx)%F.pool.length]; return f===F.capas[p.idx] ? F.pool[(k*2+p.idx+1)%F.pool.length] : f; };
  sl.push({t:"capa", tit:c.t, sub: c.ofertas ? "Arraste para ver os preços →" : "Arraste para o lado →", f:F.capas[p.idx]});
  (c.ofertas||[]).forEach(o=>sl.push({t:"oferta", tit:o[0], desc:o[1], preco:o[2], f:F.ofertas[o[3]]||prox()}));
  (c.itens||[]).forEach((it,i)=>sl.push({t:"item", n:String(i+1).padStart(2,"0"), tit:it[0], tx:it[1], f:prox()}));
  sl.push({t:"cta", tit: c.fim ? c.fim : m.ctaTit, tx: m.ctaTx, f:F.capas[p.idx]});
  return sl;
}
function marcaHTML(m){ return `<div class="marca"><i></i>${m.nome}</div>`; }
function arteSlide(m,s,i,n){
  const v = styleVars(m.vars);
  const pag = n>1 ? `<div class="pag">${i+1}/${n}</div>` : "";
  if(s.t==="capa"){ const longo = s.tit.length>22; return `<div class="arte feed t-capa" style="${v}">${foto(s.f,"center 70%")}<div class="veu-top" style="--solid:${longo?40:30}%;--fade:${longo?66:58}%"></div><div class="faixa">${m.cat}</div><div class="tit">${s.tit}</div><div class="sub" style="--subtop:${longo?60:46}cqw">${s.sub}</div><div class="marca" style="color:#fff;text-shadow:0 .4cqw 2cqw rgba(0,0,0,.6)"><i></i>${m.nome}</div>${pag?pag.replace('class="pag"','class="pag" style="color:#fff;opacity:1;text-shadow:0 .4cqw 2cqw rgba(0,0,0,.6)"'):""}</div>`; }
  if(s.t==="item") return `<div class="arte feed t-item" style="${v}"><div class="n">${s.n}</div><div class="tit">${s.tit}</div>${s.tx?`<div class="tx" style="--txtop:${s.tit.length>16?72:62}cqw;right:58cqw">${s.tx}</div>`:""}<div class="moldura">${imgIn(s.f)}</div>${marcaHTML(m)}${pag}</div>`;
  if(s.t==="oferta") return `<div class="arte feed t-oferta" style="${v}">${foto(s.f,"center 65%")}<div class="veu-top" style="--solid:22%;--fade:50%"></div><div class="tit">${s.tit}</div><div class="desc" style="right:6cqw">${s.desc}</div><div class="preco" style="top:auto;bottom:16cqw"><small>por</small><b>${/^\d/.test(s.preco)?"R$ "+s.preco:s.preco}</b></div><div class="marca" style="color:#fff;text-shadow:0 .4cqw 2cqw rgba(0,0,0,.6)"><i></i>${m.nome}</div>${pag?pag.replace('class="pag"','class="pag" style="color:#fff;opacity:1;text-shadow:0 .4cqw 2cqw rgba(0,0,0,.6)"'):""}</div>`;
  return `<div class="arte feed t-cta" style="${v}"><div class="moldura" style="left:6cqw;right:auto;top:6cqw;bottom:auto;width:30cqw;height:30cqw;border-radius:50%">${imgIn(s.f)}</div><div class="tit" style="top:44cqw">${s.tit}</div><div class="tx" style="top:82cqw">${s.tx}</div><div class="bt" style="top:96cqw">@${m.handle}</div>${marcaHTML(m)}${pag}</div>`;
}
function arteStory(m,s){
  const [tpl,eye,big,p,preco] = s;
  const v = styleVars(m.vars);
  let corpo = "";
  if(tpl==="enquete") corpo = `<div class="s-txt" style="top:18cqw"><div class="s-eye">${eye}</div><div class="s-big">${big}</div></div><div class="poll" style="top:auto;bottom:34cqw"><b>${big}</b><div>${big.replace("?","").split(" ou ").map(x=>`<span>${x}</span>`).join("")}</div></div>`;
  else if(tpl==="menu") corpo = `<div class="s-txt" style="top:18cqw"><div class="s-eye">${eye}</div><div class="s-big" style="font-size:12cqw">${big}</div><div class="menu-card"><ul class="menu" style="margin-top:0">${m.menu.map(([a,b])=>`<li><span>${a}</span><b>${/^\d/.test(b)?"R$ "+b:b}</b></li>`).join("")}</ul></div></div>`;
  else corpo = `<div class="s-txt" style="top:18cqw"><div class="s-eye">${eye}</div><div class="s-big">${big}</div>${p?`<div class="s-p">${p}</div>`:""}${preco?`<div class="s-chip">R$ ${preco}</div>`:""}</div>`;
  return `<div class="arte vert foto-txt" style="${v}">${foto(s.foto)}<div class="veu-esc"></div>${corpo}<div class="marca" style="bottom:7cqw">@${m.handle}</div></div>`;
}
function arteReel(m,r,parado){
  const n=r.cenas.length, dur=n*2.2;
  const v = styleVars(m.vars);
  const cenas = r.cenas.map(([txt],i)=>`<div class="cena" style="--dur:${dur}s;--del:${i*2.2}s">${foto(r.fotos[i])}<div class="veu-esc"></div><div class="s-txt" style="top:20cqw"><div class="s-eye">${m.nome}</div><div class="s-big">${txt}</div></div></div>`).join("");
  return `<div class="arte vert foto-txt ${parado?"parado":""}" style="${v}">${cenas}${parado?`<div class="play"><i>▶</i></div>`:""}</div>`;
}
function capaDe(m,p){
  if(p.tipo==="carrossel") return arteSlide(m, slidesDe(m,p)[0], 0, 1);
  if(p.tipo==="reels") return arteReel(m, p.dados, true);
  return arteStory(m, p.dados);
}
function legendaDe(m,p){
  const cta = m.ctaTx + ".";
  const intro = {carrossel:"Arrasta pro lado e confere.", reels:"Assiste até o fim.", story:""}[p.tipo];
  return `${p.titulo}\n\n${intro} ${cta}\n\n<span class="h">${HASH[m.id].join(" ")}</span>`;
}

  $("#subtit").textContent = `Stories todo dia com ${m.resumo}; carrosséis 3 vezes por semana e um Reels por sábado. Toque em qualquer arte para ver em tamanho real.`;
  const cont = (t)=>ps.filter(p=>p.tipo===t).length;
  $("#kpis").innerHTML = `<div class="kpi"><b>${cont("story")}</b><span>stories</span></div><div class="kpi"><b>${cont("carrossel")}</b><span>carrosséis</span></div><div class="kpi"><b>${cont("reels")}</b><span>Reels</span></div><div class="kpi"><b>${ps.filter(p=>p.status==="pub").length}</b><span>já publicados</span></div>`;
  $("#negocios").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{marca=b.dataset.m; render();});
  $("#vCal").classList.toggle("on",vista==="cal"); $("#vIg").classList.toggle("on",vista==="ig");
  $("#telaCal").hidden = vista!=="cal"; $("#telaIg").hidden = vista!=="ig";
  vista==="cal" ? renderCal(m,ps) : renderIg(m,ps);
}
function renderCal(m,ps){
  const ini = new Date(ANO,MES,1).getDay();
  let h = SEMANA.map(s=>`<div class="sem">${s}</div>`).join("");
  for(let i=0;i<ini;i++) h += `<div class="dia vazio"></div>`;
  for(let d=1; d<=30; d++){
    const doDia = ps.filter(p=>p.dia===d), feed = doDia.filter(p=>p.tipo!=="story"), st = doDia.find(p=>p.tipo==="story");
    const status = doDia[0]?.status;
    h += `<div class="dia ${d===HOJE?"hoje":""}" role="button" tabindex="0" data-dia="${d}" aria-label="${dataBR(d)}: ${doDia.length} peças">
      <div class="num"><span>${d}${d===HOJE?" · hoje":""}</span><span class="st" style="background:${status==="pub"?"var(--pub)":"var(--agd)"}"></span></div>
      <div class="miniaturas">${feed.map(p=>`<button class="mini ${p.tipo==="reels"?"vert":"feed"}" data-p="${p.id}" aria-label="${NOME_TIPO[p.tipo]}: ${p.titulo}"><span class="ico">${p.tipo==="reels"?"REELS":"CARR."}</span>${capaDe(m,p)}</button>`).join("")}</div>
      ${st?`<button class="storyb" data-p="${st.id}" aria-label="Story: ${st.titulo}"><span class="r"><i></i></span>story</button>`:""}
    </div>`;
  }
  $("#telaCal").innerHTML = `<div class="cal">${h}</div>`;
  $("#telaCal").querySelectorAll("[data-p]").forEach(b=>b.onclick=(e)=>{e.stopPropagation(); abrirPeca(b.dataset.p);});
  $("#telaCal").querySelectorAll("[data-dia]").forEach(c=>{ const f=()=>abrirDia(+c.dataset.dia); c.onclick=f; c.onkeydown=(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f();}}; });
}
function renderIg(m,ps){
  const feed = ps.filter(p=>p.tipo!=="story").sort((a,b)=>b.dia-a.dia);
  const pubs = feed.filter(p=>p.status==="pub").length;
  $("#telaIg").innerHTML = `<div class="perfilwrap">
    <div class="fone"><div class="ig">
      <div class="hdr"><b>${m.handle}</b><span>＋ ☰</span></div>
      <div class="top"><button class="av" id="avatar" aria-label="Ver stories"><div style="position:relative">${imgIn(FOTOS[m.id].avatar,"fotoav")}</div></button>
        <div class="stats"><div><b>${pubs + 87}</b>posts</div><div><b>${m.seguidores}</b>seguidores</div><div><b>${m.seguindo}</b>seguindo</div></div></div>
      <div class="bio"><b>${m.nome}</b><span class="cat">${m.cat}</span><br>${m.bio.join("<br>")}<br><a href="#" onclick="return false">${m.link}</a></div>
      <div class="btns"><div class="seg">Seguir</div><div>Mensagem</div><div>Contato</div></div>
      <div class="dest">${m.destaques.map((d,i)=>`<div><i><span style="position:relative;display:block">${imgIn(FOTOS[m.id].destaques[i],"fotoav")}</span></i>${d}</div>`).join("")}</div>
      <div class="tabs"><div class="on">▦ Posts</div><div>▶ Reels</div><div>☺ Marcados</div></div>
      <div class="grid">${feed.map(p=>`<button data-p="${p.id}" aria-label="${p.titulo}">${capaDe(m,p)}<span class="tp">${p.tipo==="reels"?"▶":"❐"}</span>${p.status==="agd"?`<span class="ag">${p.dia}/11</span>`:""}</button>`).join("")}</div>
    </div></div>
    <div class="lado">
      <h2>Assim o perfil fica no fim do mês</h2>
      <p>O grid mostra os carrosséis e Reels do plano, do mais novo para o mais antigo. Os marcados em azul ainda estão agendados. Toque na foto do perfil para ver os stories dos últimos dias.</p>
      <ul>
        <li><b>Identidade constante:</b> as mesmas cores, fontes e tom em todas as peças.</li>
        <li><b>Grid variado:</b> capas de carrossel intercaladas com Reels.</li>
        <li><b>Stories diários:</b> mantêm o perfil vivo entre um post e outro.</li>
        <li><b>Aprovação semanal:</b> o cliente aprova a semana inteira pelo celular, de uma vez.</li>
      </ul>
    </div></div>`;
  $("#telaIg").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>abrirPeca(b.dataset.p));
  $("#avatar").onclick = ()=>{ const d=Math.min(Math.max(HOJE,5),30); const lista = agenda[marca].filter(p=>p.tipo==="story" && p.dia<=d && p.dia>d-5).sort((a,b)=>a.dia-b.dia); abrirStories(lista,0); };
}

/* ================= modais ================= */
let timer = null;
function fecharModal(){ clearInterval(timer); timer=null; $("#modal").hidden = true; $("#caixa").innerHTML=""; }
$("#modal").onclick = (e)=>{ if(e.target.id==="modal") fecharModal(); };
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape" && !$("#modal").hidden) fecharModal(); });
function abrir(html){ clearInterval(timer); $("#caixa").innerHTML = `<button class="fechar" id="fechar" aria-label="Fechar">×</button>${html}`; $("#modal").hidden=false; $("#fechar").onclick=fecharModal; }
function acharPeca(id){ return agenda[marca].find(p=>p.id===id); }
function infoHTML(m,p){
  return `<div class="info"><div class="tags"><span class="tag">${NOME_TIPO[p.tipo]}</span><span class="tag ${p.status}">${p.status==="pub"?"Publicado":"Agendado"}</span></div>
    <h3>${p.titulo}</h3><div style="color:var(--tx2);font-size:13px">${dataBR(p.dia)} · ${p.hora}</div>
    ${p.tipo!=="story"?`<div class="legenda">${legendaDe(m,p)}</div>`:`<div class="legenda">Story de 24 horas. Os de cardápio e promoção vão para o destaque.</div>`}
    <div class="dica">${p.tipo==="reels"?`Vídeo vertical de ${p.dados.cenas.length*2.2|0} segundos, com ${m.trilha.toLowerCase()}.`:p.tipo==="carrossel"?"Arraste ou use as setas para ver todos os slides.":"No Instagram, enquetes e links são adicionados na hora de postar."}</div></div>`;
}
function abrirPeca(id){
  const p = acharPeca(id), m = MARCAS[marca]; if(!p) return;
  if(p.tipo==="story"){ const lista=agenda[marca].filter(x=>x.tipo==="story"); return abrirStories(lista, lista.indexOf(p), true); }
  if(p.tipo==="reels"){
    abrir(`<div class="visor"><div class="palco"><div class="quadro vert">${arteReel(m,p.dados,false)}<div class="barras"><i><b id="rb"></b></i></div><div class="som"><span class="eq"><i></i><i></i><i></i></span>${m.trilha}</div></div></div>${infoHTML(m,p)}</div>`);
    const total = p.dados.cenas.length*2200, t0 = performance.now();
    timer = setInterval(()=>{ const b=$("#rb"); if(b) b.style.width = (((performance.now()-t0)%total)/total*100)+"%"; },100);
    return;
  }
  const sl = slidesDe(m,p); let i = 0;
  abrir(`<div class="visor"><div class="palco"><div style="width:min(100%,460px)"><div class="quadro" style="width:100%"><div class="trilho" id="tr">${sl.map((s,k)=>arteSlide(m,s,k,sl.length)).join("")}</div>
    <button class="nav e" id="ant" aria-label="Slide anterior">‹</button><button class="nav d" id="prx" aria-label="Próximo slide">›</button></div>
    <div class="pontos" id="pts">${sl.map(()=>"<i></i>").join("")}</div></div></div>${infoHTML(m,p)}</div>`);
  const ir = (k)=>{ i=Math.max(0,Math.min(sl.length-1,k)); $("#tr").style.transform=`translateX(-${i*100}%)`; $("#ant").disabled=i===0; $("#prx").disabled=i===sl.length-1; $("#pts").querySelectorAll("i").forEach((d,j)=>d.classList.toggle("on",j===i)); };
  $("#ant").onclick=()=>ir(i-1); $("#prx").onclick=()=>ir(i+1); ir(0);
  let x0=null; const q=$("#tr"); q.addEventListener("pointerdown",e=>x0=e.clientX); q.addEventListener("pointerup",e=>{ if(x0!==null && Math.abs(e.clientX-x0)>30) ir(i+(e.clientX<x0?1:-1)); x0=null; });
  $("#caixa").onkeydown=(e)=>{ if(e.key==="ArrowRight") ir(i+1); if(e.key==="ArrowLeft") ir(i-1); };
}
function abrirStories(lista, i, umSo){
  const m = MARCAS[marca];
  const vistos = umSo ? [lista[i]] : lista; let k = umSo ? 0 : i;
  const mostrar = ()=>{
    clearInterval(timer);
    const p = vistos[k];
    abrir(`<div class="visor"><div class="palco"><div class="quadro vert">${arteStory(m,p.dados)}
      <div class="barras">${vistos.map((_,j)=>`<i><b style="width:${j<k?100:0}%"></b></i>`).join("")}</div>
      <div class="tapz"><button aria-label="Anterior" id="sa"></button><button aria-label="Próximo" id="sp"></button></div></div></div>${infoHTML(m,p)}</div>`);
    const barra = $(".barras").children[k].firstElementChild, t0=performance.now();
    timer = setInterval(()=>{ const f=(performance.now()-t0)/5000; barra.style.width=Math.min(100,f*100)+"%"; if(f>=1){ if(k<vistos.length-1){k++;mostrar();} else clearInterval(timer);} },60);
    $("#sa").onclick=()=>{ if(k>0){k--;mostrar();} }; $("#sp").onclick=()=>{ if(k<vistos.length-1){k++;mostrar();} else fecharModal(); };
  };
  mostrar();
}
function abrirDia(d){
  const m = MARCAS[marca], ps = agenda[marca].filter(p=>p.dia===d);
  abrir(`<div class="lista"><h3>${dataBR(d)}</h3><p style="color:var(--tx2);font-size:13px">${ps.length} peça(s) · ${ps[0].status==="pub"?"publicadas":"agendadas"}</p>
    <div class="itens">${ps.map(p=>`<button class="item" data-p="${p.id}"><div class="th">${capaDe(m,p)}</div><b>${p.titulo}</b><span>${NOME_TIPO[p.tipo]} · ${p.hora}</span></button>`).join("")}</div></div>`);
  $("#caixa").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>abrirPeca(b.dataset.p));
}

$("#vCal").onclick=()=>{vista="cal";render();}; $("#vIg").onclick=()=>{vista="ig";render();};
render();
</script>
</body>
</html>
